cesso em Java\n| Modificador | Mesma Classe | Mesmo Pacote | Subclasse (Outro Pacote) | Mundo Exterior |\n| :--- | :---: | :---: | :---: | :---: |\n| `private` | Sim | Não | Não | Não |\n| *(default)* | Sim | Sim | Não | Não |\n| `protected` | Sim | Sim | Sim | Não |\n| `public` | Sim | Sim | Sim | Sim |\n\n### 3.3 Tratamento de Exceções\n* **Checked Exceptions:** Subclasses de `Exception` (exceto `RuntimeException`). O compilador obriga a tratar (`try-catch`) ou declarar (`throws`). Ex.: `IOException`, `SQLException`.\n* **Unchecked Exceptions:** Subclasses de `RuntimeException`. Erros de lógica que não exigem declaração obrigatória. Ex.: `NullPointerException`, `ArrayIndexOutOfBoundsException`.\n\n---\n\n### 📝 Checklist de Revisão\n- [ ] Entender a diferença entre Sobrecarga e Sobrescrita de métodos\n- [ ] Lembrar que Tuplas em Python são imutáveis e Sets não admitem duplicatas\n- [ ] Saber a tabela dos modificadores de acesso do Java (private, default, protected, public)\n- [ ] Distinguir Checked de Unchecked Exceptions em Java\n"}, {"id": "16-banco-dados", "title": "🗄️ Banco de Dados e SQL (ACID)", "category": "Fundamentos de TI", "fileName": "16 - Banco de Dados e SQL.md", "content": "---\ntags:\n  - banco-de-dados\n  - sql\n  - acid\n  - modelagem\n---\n# 🗄️ Banco de Dados e SQL\n\n---\n\n## 1. Modelagem Relacional e Normalização\n\n### 1.1 Modelo Entidade-Relacionamento (MER)\n* **Entidade:** Objeto do mundo real distinguível de outros (ex.: Fiscal, ProcessoAmbiental).\n* **Relacionamento:** Associação entre entidades com cardinalidade: $1:1$, $1:N$, $N:N$. Relacionamentos $N:N$ geram uma nova tabela associativa no modelo relacional.\n* **Chave Primária (PK):** Identificador exclusivo de cada tupla/linha da tabela.\n* **Chave Estrangeira (FK):** Atributo que estabelece a integridade referencial com a chave primária de outra tabela.\n\n### 1.2 Formas Normais (Normalização)\nProcesso sistemático para eliminar redundâncias e anomalias de inserção, atualização e exclusão:\n* **Primeira Forma Normal (1FN):**\n  - Todos os atributos contêm apenas valores atômicos e indivisíveis (sem atributos multivalorados ou compostos).\n* **Segunda Forma Normal (2FN):**\n  - Está na 1FN;\n  - Todos os atributos não-chave dependem funcionalmente da **totalidade** da chave primária (elimina dependência parcial em chaves compostas).\n* **Terceira Forma Normal (3FN):**\n  - Está na 2FN;\n  - Não existem dependências funcionais transitivas entre atributos não-chave (nenhum atributo não-chave depende de outro atributo não-chave).\n\n---\n\n## 2. Linguagem SQL\n\n### 2.1 Subconjuntos da SQL\n* **DDL (Data Definition Language):** Estrutura dos dados (`CREATE`, `ALTER`, `DROP`, `TRUNCATE`).\n* **DML (Data Manipulation Language):** Manipulação de dados (`INSERT`, `UPDATE`, `DELETE`, `SELECT`).\n* **DCL (Data Control Language):** Controle de acesso (`GRANT`, `REVOKE`).\n* **TCL (Transaction Control Language):** Controle transacional (`COMMIT`, `ROLLBACK`, `SAVEPOINT`).\n\n### 2.2 Consultas e JOINs\n* **INNER JOIN:** Retorna apenas os registros que possuem correspondência em ambas as tabelas.\n* **LEFT JOIN (ou LEFT OUTER JOIN):** Retorna todos os registros da tabela da esquerda e os correspondentes da direita (ou `NULL` onde não houver).\n* **RIGHT JOIN:** Retorna todos os registros da tabela da direita.\n* **FULL JOIN:** Retorna registros de ambas as tabelas, preenchendo com `NULL` onde não houver correspondência.\n* **Cláusulas de Agrupamento:**\n  - `WHERE`: Filtra linhas **antes** do agrupamento.\n  - `HAVING`: Filtra grupos **após** a agregação com funções (`COUNT`, `SUM`, `AVG`, `MAX`, `MIN`).\n\n---\n\n## 3. Transações e Propriedades ACID\n\n* **Atomicidade:** A transação é tratada como uma unidade indivisível: ou todas as operações são executadas com sucesso (`COMMIT`), ou todas são desfeitas (`ROLLBACK`).\n* **Consistência:** A transação leva o banco de dados de um estado válido a outro estado válido, respeitando todas as restrições de integridade.\n* **Isolamento:** As transações concorrentes são executadas de forma isolada, como se fossem executadas sequencialmente.\n* **Durabilidade:** Uma vez confirmada (`COMMIT`), as alterações tornam-se permanentes, mesmo em caso de falha de energia ou reinicialização do servidor.\n\n### 3.1 Anomalias e Níveis de Isolamento\n| Nível de Isolamento | Leitura Suja (Dirty Read) | Leitura Não Repetível | Leitura Fantasma (Phantom Read) |\n| :--- | :---: | :---: | :---: |\n| **Read Uncommitted** | Ocorre | Ocorre | Ocorre |\n| **Read Committed** | Previne | Ocorre | Ocorre |\n| **Repeatable Read** | Previne | Previne | Ocorre |\n| **Serializable** | Previne | Previne | Previne |\n\n---\n\n### 📝 Checklist de Revisão\n- [ ] Identificar a violação de 1FN, 2FN e 3FN em uma tabela dada\n- [ ] Diferenciar a função do `WHERE` e do `HAVING`\n- [ ] Conhecer a diferença entre INNER JOIN e LEFT JOIN\n- [ ] Memorizar os 4 pilares do ACID\n- [ ] Lembrar a ordem dos níveis de isolamento e as anomalias prevenidas\n"}, {"id": "17-ux-ui", "title": "🎨 Experiência do Usuário (UX/UI e Acessibilidade)", "category": "Fundamentos de TI", "fileName": "17 - Experiência do Usuário (UX, UI e Acessibilidade).md", "content": "---\ntags:\n  - ux\n  - ui\n  - usabilidade\n  - acessibilidade\n---\n# 🎨 Experiência do Usuário (UX, UI e Acessibilidade)\n\n---\n\n## 1. Design Centrado no Usuário (UCD) e Usabilidade\n\n### 1.1 Fases do Design Centrado no Usuário\n1. Compreensão e especificação do contexto de uso;\n2. Especificação dos requisitos de usuário e de negócio;\n3. Criação e prototipação das soluções de design;\n4. Avaliação das soluções em relação aos requisitos de usabilidade.\n\n### 1.2 As 10 Heurísticas de Usabilidade de Jakob Nielsen\n1. **Visibilidade do status do sistema:** Manter o usuário informado sobre o que está acontecendo em tempo razoável (ex.: barras de progresso).\n2. **Correspondência entre o sistema e o mundo real:** Usar palavras, frases e conceitos familiares ao usuário, em ordem natural.\n3. **Controle e liberdade do usuário:** Disponibilizar saídas de emergência claras para reverter ações acidentais (Undo/Redo, botão cancelar).\n4. **Consistência e padrões:** Seguir convenções de mercado e manter consistência visual e funcional em toda a aplicação.\n5. **Prevenção de erros:** Projetar sistemas que impeçam o erro antes que ele ocorra.\n6. **Reconhecimento em vez de memorização:** Tornar elementos, ações e opções visíveis para não sobrecarregar a memória de trabalho do usuário.\n7. **Flexibilidade e eficiência de uso:** Permitir atalhos para usuários experientes e fluxos simples para iniciantes.\n8. **Design estético e minimalista:** Diálogos não devem conter informações irrelevantes ou raramente necessárias.\n9. **Ajudar os usuários a reconhecer, diagnosticar e recuperar-se de erros:** Mensagens de erro claras, sem jargões técnicos, indicando a solução.\n10. **Ajuda e documentação:** Informação fácil de pesquisar, focada na tarefa do usuário e com passos práticos.\n\n---\n\n## 2. Acessibilidade Digital e Diretrizes Governamentais\n\n### 2.1 WCAG (Web Content Accessibility Guidelines)\n* Desenvolvidas pelo W3C em 3 níveis de conformidade: **A (básico)**, **AA (padrão global exigido pelo setor público)** e **AAA (avançado)**.\n* **Os 4 Princípios do WCAG (POUR):**\n  1. **Perceptível:** A informação e os componentes da interface devem ser apresentados aos usuários em formas que eles possam perceber (ex.: texto alternativo em imagens, contraste de cores adequado, legendas em vídeos).\n  2. **Operável:** Todos os componentes de navegação devem ser operáveis (ex.: navegação completa por teclado, tempo suficiente para leitura).\n  3. **Compreensível:** A informação e a operação da interface devem ser compreensíveis (ex.: linguagem clara, formulários com ajuda e validação).\n  4. **Robusto:** O conteúdo deve ser robusto o suficiente para ser interpretado de forma confiável por uma ampla variedade de agentes de usuário, incluindo tecnologias assistivas (leitores de tela como NVDA/JAWS).\n\n### 2.2 e-MAG (Modelo de Acessibilidade em Governo Eletrônico)\n* Padrão federal brasileiro para acessibilidade de portais públicos governamentais, alinhado às diretrizes do WCAG.\n\n---\n\n### 📝 Checklist de Revisão\n- [ ] Memorizar os 4 princípios do WCAG (POUR)\n- [ ] Identificar as principais heurísticas de Nielsen em situações hipotéticas\n- [ ] Conhecer a diferença entre protótipos de baixa, média e alta fidelidade\n"}, {"id": "18-discursiva", "title": "✍️ Prova Discursiva de TI — Temas Quentes", "category": "Discursiva & Banca", "fileName": "18 - Prova Discursiva de TI — Estratégia.md", "content": "---\ntags:\n  - discursiva\n  - ti-especifico\n  - redacao-tecnica\n---\n# ✍️ Prova Discursiva de TI — Estratégia e Temas Quentes\n\n> [!IMPORTANT]\n> A Prova Discursiva vale **10,0 pontos** e é o **segundo critério de desempate geral** (logo após o Estatuto do Idoso). Obter nota inferior a **6,0 pontos (60%)** elimina o candidato do concurso, mesmo que ele tenha sido o primeiro colocado na prova objetiva.\n\n---\n\n## 1. O que a Banca Cesgranrio Avalia\n\n1. **Domínio Técnico do Conteúdo:** Uso correto da terminologia de TI, citação de normas (ISO 27001, ITIL, COBIT), leis (LGPD) e padrões da indústria.\n2. **Capacidade de Estruturação e Resolução de Problemas:** Apresentar soluções exequíveis, demonstrando raciocínio de engenharia e gestão pública de TI.\n3. **Clareza, Coesão e Objetividade:** Escrita formal, sem rodeios ou enrolação (*embromation*).\n4. **Norma-Padrão da Língua Portuguesa:** Concordância, pontuação e correção ortográfica.\n\n---\n\n## 2. Estrutura Recomendada para a Resposta (4 Parágrafos)\n\nPara um texto dissertativo-técnico de 20 a 30 linhas:\n\n1. **Parágrafo 1: Contextualização e Diagnóstico (4 a 5 linhas)**\n   - Defina o problema apresentado no enunciado.\n   - Apresente os conceitos teóricos centrais (ex.: \"A transição de um sistema legado para microsserviços exige planejamento arquitetural...\").\n2. **Parágrafo 2: Fundamentação Técnica e Normativa (7 a 8 linhas)**\n   - Descreva a abordagem técnica adotada.\n   - Cite ferramentas, frameworks ou normas aplicáveis (ex.: Docker, Kubernetes, ITIL 4, LGPD Art. 7º).\n3. **Parágrafo 3: Proposta de Solução e Plano de Ação (7 a 8 linhas)**\n   - Detalhe os passos práticos da implementação ou correção.\n   - Explique como mitigar riscos associados (ex.: testes automatizados, pipeline DevSecOps, controle de acesso).\n4. **Parágrafo 4: Conclusão e Governança (4 a 5 linhas)**\n   - Resuma os ganhos esperados (escalabilidade, segurança, eficiência, economia de recursos públicos).\n   - Enfatize o monitoramento contínuo e alinhamento estratégico com o negócio da SEMA.\n\n---\n\n## 3. 🎯 8 Temas Prováveis no Contexto da SEMA/MT\n\n1. **Adequação de Sistemas à LGPD e Arquitetura Zero Trust:** Como estruturar o tratamento de dados pessoais no portal de serviços ambientais respeitando os direitos dos titulares e garantindo segurança no acesso de servidores e terceiros.\n2. **Migração de Sistema Legado Monolítico para Microsserviços:** Benefícios, desafios de dados distribuídos (transações distribuídas e consistência eventual) e uso de contêineres Docker/K8s.\n3. **Implementação de Pipeline DevSecOps:** Automação de testes de segurança estáticos (SAST) e dinâmicos (DAST) em esteiras de integração contínua para os sistemas da SEMA.\n4. **Arquitetura de Dados para Monitoramento Ambiental:** Estruturação de Data Lake e Business Intelligence para processamento em lote e streaming de alertas de desmatamento e queimadas.\n5. **Plano de Resposta a Incidentes e Continuidade (Ransomware):** Procedimentos de contenção, restauração com base em RTO/RPO e política de backups imutáveis conforme ISO 27005 e BCP/DRP.\n6. **Gestão de Incidentes e Mudanças com ITIL 4:** Estruturação da Central de Serviços da SEMA para suportar usuários internos e externos durante falhas de sistemas críticos.\n7. **Uso de Machine Learning e Visão Computacional:** Aplicação de redes neurais convolucionais (CNNs) para análise automatizada de imagens de satélite no licenciamento rural.\n8. **Modelagem de Banco de Dados e Otimização SQL:** Resolução de gargalos de desempenho em consultas analíticas em sistemas com grande volume de transações.\n\n---\n\n### 📝 Checklist de Treino\n- [ ] Treinar pelo menos 1 discursiva técnica a cada 10 dias com folha pautada\n- [ ] Cronometrar o tempo de escrita (ideal: 45 a 60 minutos para a discursiva)\n- [ ] Memorizar a estrutura de 4 parágrafos (Diagnóstico ➔ Teoria ➔ Solução ➔ Conclusão)\n"}, {"id": "19-cesgranrio", "title": "🎓 Estratégia Banca Cesgranrio (TI)", "category": "Discursiva & Banca", "fileName": "19 - Estratégia Banca Cesgranrio para TI.md", "content": "---\ntags:\n  - cesgranrio\n  - banca\n  - estrategia-ti\n---\n# 🎓 Estratégia para a Banca Cesgranrio (TI)\n\n---\n\n## 1. Perfil da Cesgranrio em Provas de TI\n\nA Fundação Cesgranrio é a banca responsável pelos maiores concursos de tecnologia do Brasil nos últimos anos:\n* **Concursos Recentes:** Caixa Econômica Federal (Técnico de TI 2024), BNDES (Ciência de Dados e Desenvolvimento 2024), Banco do Brasil (Agente de TI 2023), Petrobras e Transpetro (Ênfase em TI).\n* **Estilo Geral:**\n  - Questões de múltipla escolha com **5 alternativas (A, B, C, D, E)**.\n  - Enunciados objetivos, técnicos e práticos.\n  - Baixa incidência de pegadinhas meramente semânticas; o foco é no **conhecimento real do conteúdo técnico**.\n\n---\n\n## 2. O que a Cesgranrio mais cobra em cada matéria\n\n### 2.1 Banco de Dados e SQL\n* **Alta incidência:** Apresenta tabelas com dados de exemplo e pede para indicar o resultado exato de uma consulta com `JOIN`, `GROUP BY`, `HAVING` ou funções agregadoras.\n* Questões de **Normalização** pedindo para identificar qual forma normal está violada.\n* Propriedades ACID e anomalias de transações em cenários concorrentes.\n\n### 2.2 Programação (Python e Java)\n* Trechos de código em Python ou Java com laços, recursão ou fatiamento de strings/listas para prever a saída no terminal.\n* Perguntas conceituais de POO (polimorfismo vs. herança, classes abstratas e interfaces).\n\n### 2.3 Engenharia de Software e Metodologias Ágeis\n* Cenários práticos de projetos para identificar o papel responsável no Scrum (PO, SM ou Dev) ou o artefato correto.\n* Diferenças entre os tipos de teste (Unitário, Integração, Sistema, Aceitação) e práticas de XP (TDD, Pair Programming).\n\n### 2.4 DevOps, Docker e Kubernetes\n* Comandos básicos do Dockerfile (`RUN` vs. `CMD` vs. `ENTRYPOINT`).\n* Diferença funcional entre Pods, Deployments e Services no Kubernetes.\n\n### 2.5 Segurança da Informação e LGPD\n* Criptografia simétrica vs. assimétrica (quem cifra com a chave de quem na confidencialidade vs. assinatura digital).\n* Bases legais da LGPD e atribuições do Encarregado (DPO).\n\n---\n\n## 3. Gestão das 5 Horas de Prova\n\n* **Tempo Total:** 300 minutos (5 horas).\n* **Distribuição Recomendada:**\n  - 15 min: Leitura rápida do caderno de provas e esboço inicial de tópicos da **Prova Discursiva** no rascunho.\n  - 60 min: Redação definitiva da Prova Discursiva.\n  - 60 min: 15 questões de Língua Portuguesa (média de 4 min/questão).\n  - 30 min: 15 questões de Conhecimentos Gerais (Geo/História MT e Legislação - média de 2 min/questão).\n  - 105 min: 40 questões de Conhecimentos Específicos de TI (média de 2,5 min/questão).\n  - 30 min: Preenchimento cuidadoso do cartão-resposta oficial.\n\n> [!TIP]\n> Não deixe nenhuma questão em branco! Como na Cesgranrio uma questão errada **não anula** uma certa, o chute consciente em questões restantes é obrigatório.\n"}];

    marked.setOptions({
      gfm: true,
      breaks: true
    });

    mermaid.initialize({ startOnLoad: false, theme: 'default' });

    let currentDocIndex = 0;

    function processMarkdown(md) {
      md = md.replace(/^---[\s\S]*?---\s*/m, '');

      md = md.replace(/\[\[(.*?)\|(.*?)\]\]/g, function(match, p1, p2) {
        const found = DOCS.find(d => d.title.includes(p1.trim()) || d.fileName.includes(p1.trim()));
        const linkId = found ? found.id : '00-dashboard';
        return `[${p2.trim()}](#/${linkId})`;
      });

      md = md.replace(/\[\[(.*?)\]\]/g, function(match, p1) {
        const found = DOCS.find(d => d.title.includes(p1.trim()) || d.fileName.includes(p1.trim()));
        const linkId = found ? found.id : '00-dashboard';
        return `[${p1.trim()}](#/${linkId})`;
      });

      let html = marked.parse(md);

      html = html.replace(/<blockquote>\s*<p>\s*\[!NOTE\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, '<div class="callout callout-note"><strong>ℹ️ NOTA:</strong> $1</div>');
      html = html.replace(/<blockquote>\s*<p>\s*\[!TIP\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, '<div class="callout callout-tip"><strong>💡 DICA:</strong> $1</div>');
      html = html.replace(/<blockquote>\s*<p>\s*\[!WARNING\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, '<div class="callout callout-warning"><strong>⚠️ ATENÇÃO:</strong> $1</div>');
      html = html.replace(/<blockquote>\s*<p>\s*\[!IMPORTANT\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, '<div class="callout callout-important"><strong>❗ IMPORTANTE:</strong> $1</div>');
      html = html.replace(/<blockquote>\s*<p>\s*\[!CAUTION\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, '<div class="callout callout-warning"><strong>🛑 CUIDADO:</strong> $1</div>');

      html = html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/gi, '<div class="mermaid">$1</div>');

      return html;
    }

    function renderSidebar(filteredDocs = null) {
      const menu = document.getElementById('sidebarMenu');
      const docsToRender = filteredDocs || DOCS;
      
      const categories = {};
      docsToRender.forEach(doc => {
        if (!categories[doc.category]) categories[doc.category] = [];
        categories[doc.category].push(doc);
      });

      let html = '';
      for (const [category, items] of Object.entries(categories)) {
        html += `<div class="category-group">
          <div class="category-title">${category}</div>`;
        items.forEach(doc => {
          const isActive = DOCS[currentDocIndex] && DOCS[currentDocIndex].id === doc.id ? 'active' : '';
          html += `<a class="nav-item ${isActive}" onclick="loadDoc('${doc.id}')">${doc.title}</a>`;
        });
        html += `</div>`;
      }
      menu.innerHTML = html;
    }

    async function loadDoc(id) {
      const index = DOCS.findIndex(d => d.id === id);
      if (index === -1) return;

      currentDocIndex = index;
      window.location.hash = '#/' + id;

      const doc = DOCS[index];
      const contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = processMarkdown(doc.content);

      const mermaidDivs = contentArea.querySelectorAll('.mermaid');
      if (mermaidDivs.length > 0) {
        try {
          await mermaid.run({ nodes: mermaidDivs });
        } catch(e) {
          console.warn('Mermaid render warning:', e);
        }
      }

      renderNavButtons();
      renderSidebar();

      window.scrollTo({ top: 0, behavior: 'smooth' });
      document.getElementById('sidebar').classList.remove('open');
    }

    function renderNavButtons() {
      const navContainer = document.getElementById('docNav');
      let html = '';

      if (currentDocIndex > 0) {
        const prev = DOCS[currentDocIndex - 1];
        html += `<div class="doc-btn" onclick="loadDoc('${prev.id}')">
          <span class="doc-btn-label">← Anterior</span>
          <span class="doc-btn-title">${prev.title}</span>
        </div>`;
      } else {
        html += `<div></div>`;
      }

      if (currentDocIndex < DOCS.length - 1) {
        const next = DOCS[currentDocIndex + 1];
        html += `<div class="doc-btn" style="text-align: right; margin-left: auto;" onclick="loadDoc('${next.id}')">
          <span class="doc-btn-label">Próximo →</span>
          <span class="doc-btn-title">${next.title}</span>
        </div>`;
      }

      navContainer.innerHTML = html;
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const term = e.target.value.toLowerCase().trim();
      if (!term) {
        renderSidebar();
        return;
      }
      const filtered = DOCS.filter(d => 
        d.title.toLowerCase().includes(term) || 
        d.content.toLowerCase().includes(term)
      );
      renderSidebar(filtered);
    });

    document.getElementById('menuToggle').addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('open');
    });

    window.addEventListener('hashchange', function() {
      const hash = window.location.hash.replace('#/', '');
      if (hash) {
        loadDoc(hash);
      }
    });

    const initialHash = window.location.hash.replace('#/', '');
    if (initialHash && DOCS.some(d => d.id === initialHash)) {
      loadDoc(initialHash);
    } else {
      loadDoc('00-dashboard');
    }
  </script>
