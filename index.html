pilhas, filas, árvores binárias, complexidade de algoritmos O(n).\n  - [[16 - Banco de Dados e SQL]]: Álgebra relacional, normalização (1FN, 2FN, 3FN), comandos DDL/DML e propriedades ACID.\n* **Carga Horária:** 20h a 25h semanais.\n* **Meta de Validação:** > 75% de acertos em listas de exercícios de SQL e Algoritmos da Cesgranrio.\n\n### FASE 2: Engenharia de Software & Segurança (Semanas 4 a 6)\n* **Objetivo:** Dominar os pilares de desenvolvimento moderno e proteção de dados que frequentemente geram questões discursivas.\n* **Disciplinas-Chave:**\n  - [[06 - Segurança da Informação e Privacidade]]: Criptografia, PKI, Zero Trust, Firewalls/WAF e LGPD.\n  - [[07 - Desenvolvimento de Software e DevOps]]: CI/CD, Git, Docker, Kubernetes, Scrum e XP.\n  - [[08 - Arquitetura de Software e APIs]]: Microsserviços vs. Monólito, REST/SOAP, Design Patterns (GoF).\n* **Carga Horária:** 25h semanais + início do treino discursivo (1 texto a cada 10 dias).\n\n### FASE 3: Dados, Inteligência Artificial & Governança (Semanas 7 a 9)\n* **Objetivo:** Cobrir as inovações tecnológicas do edital que a Cesgranrio tem cobrado intensamente nos últimos concursos (BNDES, Banco do Brasil e Caixa).\n* **Disciplinas-Chave:**\n  - [[09 - Inteligência Artificial e Ciência de Dados]]: Machine Learning supervisionado/não-supervisionado, NLP, Redes Neurais.\n  - [[10 - Big Data e Business Intelligence]]: Modelagem dimensional (Star/Snowflake), Hadoop, NoSQL.\n  - [[11 - Tecnologias Emergentes (IoT e Blockchain)]]: Edge Computing, consenso blockchain.\n  - [[12 - Governança e Gestão de TI (ITIL e COBIT)]]: ITIL 4 (Incidentes, Problemas, Mudanças) e COBIT 2019.\n* **Carga Horária:** 25h semanais.\n\n### FASE 4: Regional, Legislação & Infraestrutura (Semanas 10 a 12)\n* **Objetivo:** Blindar os 15 pontos de Conhecimentos Gerais para **garantir não zerar nenhuma matéria** e somar pontos preciosos.\n* **Disciplinas-Chave:**\n  - [[04 - Geografia e História de MT]]: Geografia física, agronegócio, Cuiabá colonial, Rusga e desmembramento.\n  - [[05 - Ética, Filosofia, Atualidades e Legislação]]: LC 04/1990 (Estatuto MT), LC 112/2002 (Ética MT).\n  - [[14 - Sistemas Operacionais e Redes]]: Linux básico, Active Directory, DNS, DHCP.\n  - [[15 - Linguagens de Programação (Python e Java)]]: POO e sintaxe.\n* **Carga Horária:** 20h a 25h semanais.\n\n### FASE 5: Reta Final, Simulados e Discursivas (Semanas 13 e 14)\n* **Objetivo:** Gestão de tempo de prova (5 horas para 70 questões + 1 redação técnica).\n* **Atividades:**\n  - Realizar 2 simulados completos de 5 horas com cartão de resposta e folha de redação.\n  - Revisão acelerada por flashcards e mapas mentais das normas e leis.\n  - Treino de caligrafia e organização de tópicos para a Prova Discursiva.\n\n---\n\n## ⚖️ Distribuição de Carga Horária por Peso na Prova\n\n```\nConhecimentos Específicos de TI (40 pts | 57%) ──████████████████ (55% do tempo)\nLíngua Portuguesa (15 pts | 21%)                ──██████ (18% do tempo)\nGeografia e História de MT (10 pts | 14%)       ──████ (15% do tempo)\nÉtica, Filosofia e Legislação (5 pts | 7%)      ──██ (12% do tempo)\nDiscursiva (10 pts adicionais)                  ── Treino contínuo semanal\n```\n\n---\n\n## 📅 Ciclo Semanal Sugerido (Exemplo 20h/semana)\n\n| Dia | Bloco 1 (1h30) | Bloco 2 (1h30) | Fechamento (30min) |\n| :--- | :--- | :--- | :--- |\n| **Segunda** | Conhecimentos Específicos: Banco de Dados / SQL | Língua Portuguesa | Resolução de 15 questões |\n| **Terça** | Conhecimentos Específicos: Engenharia de Software / DevOps | Geografia de Mato Grosso | Flashcards / Anki |\n| **Quarta** | Conhecimentos Específicos: Segurança da Informação & LGPD | História de Mato Grosso | Resolução de 15 questões |\n| **Quinta** | Conhecimentos Específicos: Governança (ITIL / COBIT) | Ética & Legislação MT (LC 04 e LC 112) | Leitura de Lei Seca |\n| **Sexta** | Conhecimentos Específicos: IA, Big Data ou Algoritmos | Língua Portuguesa | Resolução de 20 questões |\n| **Sábado** | **Produção de Prova Discursiva de TI (Tema Técnico)** | Revisão dos erros da semana | Leitura de resumos |\n| **Domingo** | Descanso / Simulado Parcial ou Leitura Leve | - | Planejamento da semana |\n"}, {"id": "02-cronograma", "title": "📅 Cronograma Oficial", "category": "Planejamento", "fileName": "02 - Cronograma Oficial.md", "content": "---\ntags:\n  - cronograma\n  - datas\n  - edital\n---\n# 📅 Cronograma Oficial — Concurso SEMA/MT 2026\n\nTodas as datas e prazos cruciais compilados diretamente do **Anexo IV** do Edital nº 1/2026 da SEMA/MT:\n\n| Data / Período | Evento do Concurso | Status / Observação |\n| :--- | :--- | :--- |\n| **01/09/2026** | Publicação do Edital no Diário Oficial do Estado de MT | Concluído |\n| **17/09 a 14/10/2026** | **Período Oficial de Inscrições** (até 16h MT / www.cesgranrio.org.br) | **Aberto** |\n| 17/09 a 24/09/2026 | Período de solicitação de isenção da taxa de inscrição | Prazo restrito |\n| 30/09/2026 | Divulgação do resultado preliminar dos pedidos de isenção | No site da banca |\n| 30/09 e 01/10/2026 | Recursos contra indeferimento da isenção | 2 dias |\n| 09/10/2026 | Resultado definitivo da isenção pós-recursos | - |\n| Conforme DAR | Último dia para pagamento do Documento de Arrecadação (R$ 150,00) | Atenção ao banco |\n| 22/10/2026 | Divulgação preliminar de inscrições deferidas (PcD, Negros, Especial) | - |\n| 22 e 23/10/2026 | Recursos sobre inscrições | - |\n| 30/10/2026 | Homologação final das inscrições deferidas | - |\n| **08/12/2026** | **Divulgação do Cartão de Confirmação (Locais e Horários de Prova)** | Consulta individual |\n| **13/12/2026** | **APLICAÇÃO DAS PROVAS OBJETIVAS E DISCURSIVA** | **Duração de 5h em Cuiabá/MT** |\n| 14/12/2026 | Divulgação dos Gabaritos Preliminares das Provas Objetivas | A partir das 10h |\n| 14 e 15/12/2026 | Interposição de recursos contra os gabaritos preliminares | Prazo recursal |\n| 22/01/2027 | Disponibilização da imagem do cartão-resposta digitalizado | Área do Candidato |\n| **28/01/2027** | **Divulgação das Notas da Prova Objetiva e Notas Preliminares da Discursiva** | Marco decisivo |\n| 28 e 29/01/2027 | Vista da Prova Discursiva e Pedido de Revisão de Notas | Análise técnica |\n| 16/02/2027 | Resultado final dos recursos da Prova Discursiva | - |\n| 19/02/2027 | Convocação para Heteroidentificação e Avaliação PcD | - |\n| 27/02 a 01/03/2027 | Realização presencial da Heteroidentificação e Perícia PcD | Presencial em Cuiabá |\n| 16/03/2027 | Resultado preliminar da Heteroidentificação e PcD | - |\n| 16 e 17/03/2027 | Recursos contra Heteroidentificação / PcD | - |\n| **27/03/2027** | **DIVULGAÇÃO DO RESULTADO FINAL E HOMOLOGAÇÃO** | **Classificação final** |\n\n> [!IMPORTANT]\n> **Validade do Concurso:** O concurso terá validade de **2 (dois) anos**, a contar da data de publicação da homologação do resultado final, podendo ser prorrogado uma única vez por igual período, a critério da SEMA/MT.\n"}, {"id": "03-portugues", "title": "📝 Língua Portuguesa", "category": "Conhecimentos Básicos", "fileName": "03 - Língua Portuguesa.md", "content": "---\ntags: [portugues, basico, 15-questoes]\n---\n# 📝 Língua Portuguesa (15 questões | 15 pontos)\n\n> [!IMPORTANT]\n> Você não pode zerar esta disciplina! Uma base sólida em Língua Portuguesa é essencial para a aprovação.\n\n## 1. Compreensão e interpretação de textos\n- **Resumo Teórico:** Compreensão refere-se ao que está escrito (dados explícitos). Interpretação refere-se ao que se deduz do texto (implícitos).\n- **Dicas Cesgranrio:** A banca gosta de textos densos (artigos de opinião, crônicas). Leia o comando da questão antes do texto.\n- **Pontos-chave:**\n  - Diferencie informação explícita de inferência.\n  - Atenção ao vocabulário.\n  - Identifique o tema central e a intenção do autor.\n\n## 2. Argumentação e persuasão\n- **Resumo Teórico:** Argumentação visa convencer o leitor. Utiliza-se de dados, exemplos, autoridades e raciocínio lógico. Falácias são erros de raciocínio.\n- **Dicas Cesgranrio:** Cuidado com questões que pedem para identificar o argumento principal ou classificar a falácia.\n- **Pontos-chave:**\n  - Tipos de arguments (autoridade, evidência, princípio).\n  - Estrutura: tese, desenvolvimento, conclusão.\n  - Reconhecimento de falácias comuns.\n\n## 3. Comunicação assertiva\n- **Resumo Teórico:** Uso de linguagem clara, objetiva, livre de ambiguidades e jargões desnecessários, adequada ao contexto corporativo e oficial.\n- **Dicas Cesgranrio:** Foco em questões que pedem reescrita de frases para torná-las mais diretas e sem ruídos.\n- **Pontos-chave:**\n  - Linguagem simples.\n  - Concisão (evitar prolixidade).\n  - Objetividade.\n\n## 4. Organização textual\n- **Resumo Teórico:** Estrutura em parágrafos que dividem introdução, desenvolvimento e conclusão.\n- **Dicas Cesgranrio:** Questões sobre a função de um parágrafo específico ou a ordem lógica dos períodos.\n- **Pontos-chave:**\n  - Tópico frasal.\n  - Desenvolvimento da ideia.\n  - Paragrafação adequada.\n\n## 5. Coesão e coerência\n- **Resumo Teórico:** Coesão é a ligação gramatical (pronomes, conjunções). Coerência é a lógica de sentido.\n- **Dicas Cesgranrio:** Troca de conjunções (causa, concessão, oposição) é muito cobrada!\n- **Pontos-chave:**\n  - Elementos anafóricos e catafóricos.\n  - Conjunções coordenativas e subordinativas.\n  - Manutenção do sentido.\n\n## 6. Tipologia textual\n- **Resumo Teórico:** Diferença entre narração (fatos), descrição (características), dissertação (argumentação/exposição) e injunção (ordens).\n- **Dicas Cesgranrio:** Identificação da tipologia predominante e secundária em textos híbridos.\n- **Pontos-chave:**\n  - Injunção: manuais, receitas.\n  - Exposição: informar sem opinar.\n  - Dissertação: defender ponto de vista.\n\n## 7. Ortografia oficial\n- **Resumo Teórico:** Uso correto de letras (s/z, x/ch, j/g) e formas variantes.\n- **Dicas Cesgranrio:** Uso do \"porquê\", mal/mau, onde/aonde, acerca de / a cerca de.\n- **Pontos-chave:**\n  - Regras do X e CH.\n  - Uso dos porquês.\n  - Palavras homônimas parônimas.\n\n## 8. Acentuação gráfica\n- **Resumo Teórico:** Regras baseadas na tonicidade: oxítonas, paroxítonas e proparoxítonas.\n- **Dicas Cesgranrio:** A banca foca nas exceções e regras do Novo Acordo (ditongos abertos e hiatos).\n- **Pontos-chave:**\n  - Todas proparoxítonas são acentuadas.\n  - Acentuação de oxítonas e paroxítonas.\n  - Regras dos hiatos (i e u tônicos).\n\n## 9. Crase\n- **Resumo Teórico:** Fusão da preposição 'a' com o artigo 'a' ou pronome demonstrativo.\n- **Dicas Cesgranrio:** Troque a palavra feminina por masculina; se virar \"ao\", tem crase.\n- **Pontos-chave:**\n  - Obrigatória: locuções femininas.\n  - Proibida: antes de verbos e palavras masculinas.\n  - Facultativa: pronomes possessivos femininos, nomes próprios femininos, até a.\n\n## 10. Sintaxe da oração e do período\n- **Resumo Teórico:** Análise dos termos essenciais (sujeito, predicado), integrantes e acessórios. Período simples e composto (coordenação e subordinação).\n- **Dicas Cesgranrio:** Identificação de sujeito (oculto, indeterminado, oracional) e função sintática do \"que\" e \"se\".\n- **Pontos-chave:**\n  - Tipos de sujeito.\n  - Vozes verbais.\n  - Orações subordinadas adjetivas e substantivas.\n\n## 11. Pontuação\n- **Resumo Teórico:** Uso de sinais de pontuação para organizar o raciocínio. A vírgula é o mais cobrado.\n- **Dicas Cesgranrio:** Nunca se separa sujeito do verbo, nem verbo do complemento com vírgula.\n- **Pontos-chave:**\n  - Vírgula em adjunto adverbial deslocado.\n  - Uso do travessão para isolar aposto.\n  - Ponto e vírgula em enumerações.\n\n## 12. Concordância nominal e verbal\n- **Resumo Teórico:** Ajuste de flexão entre termos. Verbal (verbo e sujeito) e Nominal (nome e determinantes).\n- **Dicas Cesgranrio:** Casos do verbo haver (impessoal) e fazer (tempo).\n- **Pontos-chave:**\n  - Verbo \"haver\" no sentido de existir = singular.\n  - Sujeito composto posposto.\n  - Concordância com expressões partitivas.\n\n## 13. Regência nominal e verbal\n- **Resumo Teórico:** Relação de dependência entre as palavras e seus complementos (com ou sem preposição).\n- **Dicas Cesgranrio:** Verbos clássicos: assistir, visar, preferir, aspirar.\n- **Pontos-chave:**\n  - Assistir (ver = a, ajudar = sem prep).\n  - Visar (almejar = a, mirar = sem prep).\n  - Preferir algo a outra coisa.\n\n## 14. Significação das palavras\n- **Resumo Teórico:** Sentido das palavras no contexto. Sinônimos, antônimos, parônimos (parecidos) e homônimos (iguais). Polissemia (vários sentidos).\n- **Dicas Cesgranrio:** Questões de reescrita pedindo sinônimos perfeitos no contexto.\n- **Pontos-chave:**\n  - Diferença parônimos/homônimos.\n  - Polissemia vs ambiguidade.\n  - Vocabulário erudito básico.\n\n## 15. Colocação pronominal\n- **Resumo Teórico:** Posição do pronome oblíquo átono em relação ao verbo: próclise (antes), mesóclise (meio), ênclise (depois).\n- **Dicas Cesgranrio:** Palavras atrativas (negativas, advérbios, pronomes relativos) exigem próclise.\n- **Pontos-chave:**\n  - Nunca começar frase com pronome oblíquo átono.\n  - Mesóclise só em futuro do presente/pretérito sem palavra atrativa.\n  - Principais atratores de próclise.\n\n## 16. Redação Oficial\n- **Resumo Teórico:** Normas do Manual de Redação da Presidência da República (3ª edição).\n- **Dicas Cesgranrio:** Padrão Ofício (extinção de memorando e aviso), pronomes de tratamento.\n- **Pontos-chave:**\n  - Atributos da redação oficial (impessoalidade, clareza, concisão).\n  - Vocativo e fecho corretos (Respeitosamente / Atenciosamente).\n  - Estrutura do Padrão Ofício.\n\n## 17. Novo Acordo Ortográfico\n- **Resumo Teórico:** Mudanças na acentuação e no uso do hífen.\n- **Dicas Cesgranrio:** Foco no fim do acento em ditongos abertos (ei, oi) nas paroxítonas (ex: ideia, jiboia).\n- **Pontos-chave:**\n  - Hífen com prefixos.\n  - Vogais iguais separam, vogais diferentes juntam.\n  - Fim do trema.\n\n## Material de Referência\n- **Livros:** Gramática para Concursos (Pestana)\n- **Sites:** QConcursos (filtre por Cesgranrio), YouTube (Canais de professores como Flávia Rita, Elias Santana)\n\n## Checklist de Revisão\n- [ ] Compreensão e interpretação de textos\n- [ ] Argumentação e persuasão\n- [ ] Comunicação assertiva\n- [ ] Organização textual\n- [ ] Coesão e coerência\n- [ ] Tipologia textual\n- [ ] Ortografia oficial\n- [ ] Acentuação gráfica\n- [ ] Crase\n- [ ] Sintaxe da oração e do período\n- [ ] Pontuação\n- [ ] Concordância nominal e verbal\n- [ ] Regência nominal e verbal\n- [ ] Significação das palavras\n- [ ] Colocação pronominal\n- [ ] Redação Oficial\n- [ ] Novo Acordo Ortográfico\n"}, {"id": "04-geografia-historia-mt", "title": "🗺️ Geografia e História de MT", "category": "Conhecimentos Gerais", "fileName": "04 - Geografia e História de MT.md", "content": "---\ntags: [geografia, historia, mato-grosso, 10-questoes]\n---\n# 🗺️ Geografia e História Política e Econômica de MT (10 questões | 10 pontos)\n\n> [!IMPORTANT]\n> Você não pode zerar esta disciplina! Por ser matéria regional, muitos candidatos têm dificuldade. Faça a diferença aqui!\n\n## PARTE 1: GEOGRAFIA DE MT\n\n### 1. Produção do espaço regional\n- **Resumo Teórico:** Formação ligada aos ciclos econômicos (mineração, borracha, pecuária) culminando na moderna expansão agropecuária e consolidação da fronteira agrícola.\n- **Dicas Cesgranrio:** Relacione a infraestrutura de transportes (BR-163) com o escoamento da soja.\n- **Pontos-chave:**\n  - Marcha para o Oeste (década de 1940).\n  - Expansão agrícola a partir dos anos 70/80 (soja).\n  - Agronegócio como motor econômico e suas dinâmicas socioespaciais.\n\n### 2. Aspectos naturais\n- **Resumo Teórico:** Clima tropical continental (duas estações bem definidas). Relevo diversificado. MT é único por possuir três biomas.\n- **Dicas Cesgranrio:** Localize os biomas no mapa estadual (Norte: Amazônia, Centro/Sul/Leste: Cerrado, Sudoeste: Pantanal).\n- **Pontos-chave:**\n  - **Clima:** Tropical e Equatorial (no norte).\n  - **Relevo:** Chapadas (Guimarães, Parecis), Planícies (Pantanal) e Depressões.\n  - **Biomas:** Amazônia (54%), Cerrado (39%), Pantanal (7%).\n  - **Hidrografia:** Bacias Amazônica, Platina (Paraguai) e Tocantins-Araguaia.\n\n### 3. Políticas de gestão ambiental\n- **Resumo Teórico:** Foco no monitoramento de desmatamento, queimadas, e a criação/gestão de Unidades de Conservação e terras indígenas pela SEMA e IBAMA.\n- **Dicas Cesgranrio:** Tema muito provável para redação/questões devido à atual crise climática e incêndios no Pantanal/Cerrado.\n- **Pontos-chave:**\n  - SEMA-MT e CAR (Cadastro Ambiental Rural).\n  - Unidades de Conservação Estaduais.\n  - Conflitos ambientais: garimpo ilegal, desmatamento para pasto.\n\n### 4. Características econômicas\n- **Resumo Teórico:** MT é a maior potência do agronegócio brasileiro, líder nacional na produção de soja, algodão, milho e no rebanho bovino.\n- **Dicas Cesgranrio:** Agronegócio gera alta concentração de renda e foca em commodities para exportação.\n- **Pontos-chave:**\n  - Soja e Algodão (líder nacional).\n  - Rebanho Bovino comercial (maior do país).\n  - Industrialização focada em agroindústria (esmagamento de soja, frigoríficos, etanol de milho).\n\n### 5. Geografia da população\n- **Resumo Teórico:** População formada por intensa migração, especialmente sulistas (gaúchos/paranaenses) a partir dos anos 1970 para áreas de fronteira agrícola.\n- **Dicas Cesgranrio:** Compreenda o choque cultural e a miscigenação (cuiabano tradicional vs. migrante sulista).\n- **Pontos-chave:**\n  - Alta taxa de urbanização.\n  - Desigualdade na distribuição de renda.\n  - Migração de sulistas impulsionada por políticas do governo militar.\n\n### 6. Processo de urbanização\n- **Resumo Teórico:** Crescimento de cidades ao longo das rodovias (eixos) impulsionado pelo agronegócio.\n- **Dicas Cesgranrio:** Diferença entre a capital administrativa (Cuiabá) e os \"polos do agro\" (Sinop, Rondonópolis, Sorriso).\n- **Pontos-chave:**\n  - Cuiabá e Várzea Grande (Região Metropolitana).\n  - Rondonópolis (hub logístico/ferroviário no sul).\n  - Sinop e Sorriso (polos da BR-163 e agronegócio no norte).\n\n### 7. Dinâmica do espaço agrário\n- **Resumo Teórico:** Predominância do latifúndio monocultor, alta mecanização e tecnologia, contrastando com a agricultura familiar e assentamentos.\n- **Dicas Cesgranrio:** O modelo agroexportador e seus impactos sociais (conflitos fundiários, expropriação).\n- **Pontos-chave:**\n  - Concentração fundiária.\n  - Expansão rápida da fronteira agrícola sobre o cerrado e borda amazônica.\n  - Tensão entre modernização e conflito agrário.\n\n## PARTE 2: HISTÓRIA DE MT\n\n### 1. Povos indígenas antes da colonização\n- **Resumo Teórico:** Rica diversidade étnica antes da chegada europeia. Grupos como Bororo, Xavante, Paresi e Kayapó dominavam diferentes regiões.\n- **Dicas Cesgranrio:** Os indígenas não foram atores passivos; eles resistiram, negociaram e sofreram intenso etnocídio.\n- **Pontos-chave:**\n  - Diversidade de nações indígenas.\n  - Ocupação pré-colonial.\n  - Impacto devastador do contato europeu.\n\n### 2. Missões e catequese (séc. XVII)\n- **Resumo Teórico:** Primeiras incursões espanholas (jesuítas) na região do Itatim, catequizando indígenas para fixação.\n- **Dicas Cesgranrio:** Os jesuítas sofreram ataques de bandeirantes paulistas que buscavam escravizar os nativos.\n- **Pontos-chave:**\n  - Missões jesuíticas (espanholas).\n  - Foco na conversão.\n  - Conflito com bandeirantes.\n\n### 3. Bandeiras (séc. XVIII)\n- **Resumo Teórico:** Bandeiras de preamento (caça ao índio) e prospectoras (busca por metais preciosos) vindas de São Paulo.\n- **Dicas Cesgranrio:** Bandeiras paulistas foram as responsáveis pela expansão das fronteiras luso-brasileiras além do Tratado de Tordesilhas.\n- **Pontos-chave:**\n  - Antônio Pires de Campos e Pascoal Moreira Cabral.\n  - Escravização de indígenas.\n  - Descoberta das primeiras lavras de ouro.\n\n### 4. Cuiabá - de Arraial a Vila\n- **Resumo Teórico:** Fundação oficial em 1719 após a descoberta do ouro nas margens do Rio Coxipó por Pascoal Moreira Cabral.\n- **Dicas Cesgranrio:** Em 1727, elevou-se a Vila Real do Senhor Bom Jesus de Cuiabá. A elite \"Sorocabana\" controlava o comércio e abastecimento (Monções).\n- **Pontos-chave:**\n  - Ata de Fundação (1719).\n  - Expedições fluviais (Monções) ligando SP a Cuiabá.\n  - Sorocabanos (comerciantes influentes).\n\n### 5. Vila Bela da Santíssima Trindade\n- **Resumo Teórico:** Fundada em 1752 no Vale do Guaporé por Gomes Freire de Andrade. Foi a primeira capital da Capitania de MT.\n- **Dicas Cesgranrio:** Criada por motivos geopolíticos para garantir a posse de Portugal contra as pretensões espanholas na fronteira oeste.\n- **Pontos-chave:**\n  - Primeira Capital.\n  - Defesa militar e controle da fronteira (Tratado de Madri - 1750).\n  - Decadência precoce devido à distância e surtos de malária.\n\n### 6. Mineração\n- **Resumo Teórico:** Base econômica do séc. XVIII. Foco no ouro de aluvião.\n- **Dicas Cesgranrio:** Mão de obra majoritariamente de africanos escravizados, em condições severas.\n- **Pontos-chave:**\n  - Ciclo do Ouro.\n  - Exploração de aluvião (rápido esgotamento).\n  - Intensa utilização de escravizados africanos.\n\n### 7. Decadência da mineração → Pecuária\n- **Resumo Teórico:** Com o fim do ouro (início do séc. XIX), MT passa por isolamento econômico, substituindo a mineração pela pecuária extensiva, poaia e engenhos de açúcar.\n- **Dicas Cesgranrio:** Transição para economia de subsistência e isolamento geográfico duradouro.\n- **Pontos-chave:**\n  - Fim do ciclo aurífero.\n  - Pecuária extensiva na região pantaneira.\n  - Extrativismo (poaia/ipecacuanha e borracha depois).\n\n### 8. A Rusga (1834)\n- **Resumo Teórico:** Revolta de caráter nativista em Cuiabá (período regencial) onde \"brasileiros\" (nativistas) massacraram portugueses (adotivos).\n- **Dicas Cesgranrio:** Refletia o sentimento antilusitano e a crise econômica/política do pós-Independência.\n- **Pontos-chave:**\n  - 1834 (Período Regencial).\n  - Brasileiros x Portugueses.\n  - Contexto de crise econômica e insatisfação militar.\n\n### 9. Guerra da Tríplice Aliança (1864-1870)\n- **Resumo Teórico:** Guerra do Paraguai. MT foi a primeira província invadida por Solano López em 1864, via Rio Paraguai.\n- **Dicas Cesgranrio:** A \"Retirada da Laguna\" foi a trágica tentativa das tropas brasileiras (vindas de MG/RJ) de retomar territórios invadidos em MT (atual MS).\n- **Pontos-chave:**\n  - Invasão paraguaia em Corumbá e forte de Coimbra.\n  - Isolamento de Cuiabá.\n  - Abertura da navegação do Rio Paraguai no pós-guerra.\n\n### 10. Estado Novo e Marcha para o Oeste\n- **Resumo Teórico:** Política de Getúlio Vargas nos anos 1940 para integrar o Centro-Oeste e Amazônia. Fundação de colônias agrícolas e Cidades (Goiânia). Expedição Roncador-Xingu.\n- **Dicas Cesgranrio:** Fundação da Colônia Agrícola de Dourados e a Fundação Brasil Central.\n- **Pontos-chave:**\n  - Integração nacional de Vargas.\n  - Colonização dirigida pelo Estado.\n  - Expedição Roncador-Xingu (Irmãos Villas-Bôas).\n\n### 11. Ditadura e Divisão do Estado\n- **Resumo Teórico:** Ditadura Militar incentiva a colonização privada (projetos da SUDAM, rodovias BR-163 e BR-364). Em 1977, Lei Complementar nº 31 divide MT, criando Mato Grosso do Sul (efetivado em 1979).\n- **Dicas Cesgranrio:** O norte (atual MT) permaneceu mais focado na integração com a Amazônia, enquanto o sul (MS) estava mais ligado a SP/PR.\n- **Pontos-chave:**\n  - Incentivos fiscais e colonizadoras privadas (Sinop, etc).\n  - Divisão geopolítica em 1977 (Ernesto Geisel).\n  - Início do boom do agronegócio.\n\n### 12. Tensões no campo\n- **Resumo Teórico:** Conflitos gerados pela rápida expansão da fronteira, grilagem de terras, posseiros x fazendeiros, indígenas, e movimentos camponeses (MST).\n- **Dicas Cesgranrio:** O \"Eldorado\" mato-grossense atraiu muitos sem-terra e causou violentos conflitos rurais nas décadas de 80, 90 e 2000.\n- **Pontos-chave:**\n  - Grilagem e sobreposição de títulos de terra.\n  - Massacre de trabalhadores e lideranças rurais.\n  - Disputas envolvendo terras indígenas e Unidades de Conservação.\n\n## Dados Importantes para Memorizar\n\n| Informação | Dado |\n| :--- | :--- |\n| **Capital** | Cuiabá |\n| **Biomas** | Amazônia, Cerrado e Pantanal |\n| **Área Territorial** | ~ 903.000 km² (3º maior do BR) |\n| **População (2022)** | ~ 3,6 milhões |\n| **Principais Rios** | Paraguai, Cuiabá, Araguaia, Teles Pires, Juruena |\n| **Economia** | Agropecuária (Soja, Algodão, Milho, Bovinos) |\n\n## Checklist de Revisão\n- [ ] Produção do espaço regional\n- [ ] Aspectos naturais (clima, relevo, vegetação, hidrografia)\n- [ ] Políticas de gestão ambiental e SEMA\n- [ ] Características econômicas e Agronegócio\n- [ ] Geografia da população e demografia\n- [ ] Processo de urbanização\n- [ ] Dinâmica do espaço agrário\n- [ ] Povos indígenas antes da colonização\n- [ ] Missões e catequese (séc. XVII)\n- [ ] Bandeiras e expansão (séc. XVIII)\n- [ ] Cuiabá - fundação e ciclo do ouro\n- [ ] Vila Bela da Santíssima Trindade\n- [ ] Mineração (ouro e escravidão)\n- [ ] Decadência da mineração e Pecuária\n- [ ] A Rusga (1834)\n- [ ] Guerra do Paraguai (1864-1870) e Retirada da Laguna\n- [ ] Estado Novo, Vargas e Marcha para o Oeste\n- [ ] Ditadura, Projetos de Colonização e Divisão do Estado (1977)\n- [ ] Tensões no campo e conflitos fundiários\n"}, {"id": "05-etica-filosofia", "title": "⚖️ Ética, Filosofia e Legislação", "category": "Conhecimentos Gerais", "fileName": "05 - Ética, Filosofia, Atualidades e Legislação.md", "content": "---\ntags: [etica, filosofia, atualidades, legislacao, 5-questoes]\n---\n# ⚖️ Ética, Filosofia, Atualidades e Legislação Específica (5 questões | 5 pontos)\n\n## ÉTICA E FILOSOFIA\n\n### 1. Filosofia como busca racional\n- **Resumo:** A filosofia surge na Grécia Antiga como transição do pensamento mítico (mito) para o pensamento racional (logos).\n- **Foco:** Busca por respostas através da razão, questionamento e argumentação crítica.\n- **Pontos-chave:** Reflexão radical, rigorosa e de conjunto.\n\n### 2. Tipos de conhecimento\n- **Empírico (Senso Comum):** Baseado na experiência diária, assistemático, acrítico.\n- **Científico:** Metódico, sistemático, testável, objetivo.\n- **Filosófico:** Racional, questionador, busca os fundamentos e a essência, não precisa de validação laboratorial, mas de consistência lógica.\n- **Teológico/Religioso:** Baseado na fé e dogmas revelados.\n\n### 3. Correntes epistemológicas\n- **Racionalismo (Descartes):** A razão é a única fonte do conhecimento verdadeiro (ideias inatas). Penso, logo existo.\n- **Empirismo (Locke, Hume):** Todo conhecimento provém da experiência sensorial. A mente é uma \"tábula rasa\".\n- **Criticismo (Kant):** Síntese. O conhecimento começa com a experiência, mas não deriva todo dela; necessita das estruturas a priori da razão.\n\n### 4. Desafios contemporâneos\n- **Pós-verdade:** Fatos objetivos têm menos influência do que apelos à emoção e a crenças pessoais.\n- **Fake News:** Desinformação disseminada em rede, afetando a democracia e o debate público.\n- **Inteligência Artificial:** Dilemas éticos sobre viés algorítmico, substituição de empregos e privacidade.\n\n### 5. Assédio moral e sexual\n- **Assédio Moral:** Conduta abusiva, frequente e reiterada (palavras, atos, gestos) que atenta contra a dignidade ou integridade psíquica da pessoa (humilhações no trabalho).\n- **Assédio Sexual:** Conduta de natureza sexual, não desejada, com o intuito de obter vantagem ou favorecimento, prevalecendo-se da condição de superior hierárquico.\n- **Medidas:** Denúncias anônimas, corregedorias, canais de ética, campanhas de conscientização.\n\n### 6. Atitudes éticas\n- **Ética vs Moral:** Moral é o conjunto de regras (prática); Ética é a reflexão sobre essas regras (teoria).\n- **Serviço Público:** Pautado na legalidade, impessoalidade, moralidade, publicidade e eficiência. Respeito ao cidadão, probidade, honestidade e virtude.\n\n## ATUALIDADES\n\n> [!TIP]\n> **Dicas de Estudo para Atualidades:** Acompanhe noticiários, podcasts e resumos semanais de cursinhos. Foque em eventos com impacto nacional ou global sustentado, evitando notícias passageiras.\n\n**Temas Quentes (2025/2026):**\n- **Agenda Ambiental:** O papel do Brasil (e de MT) nas COPs, combate ao desmatamento na Amazônia e Pantanal, crise hídrica e ondas de calor extremos.\n- **Queimadas em MT:** Impactos no Pantanal, atuação da SEMA/Ibama, políticas de mitigação e fundo Amazônia.\n- **Economia Brasileira:** Reforma tributária, inflação, transição energética (hidrogênio verde, energia solar/eólica).\n- **Geopolítica:** Conflitos globais em andamento, reorganização de blocos econômicos (BRICS).\n\n## LEGISLAÇÃO ESPECÍFICA\n\n### 1. LC nº 112/2002 - Código de Ética do Servidor de MT\n- **Princípios:** Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência, Razoabilidade e Proporcionalidade.\n- **Deveres:** Zelar pelo patrimônio, urbanidade, assiduidade, sigilo profissional.\n- **Proibições:** Receber propina, usar o cargo para favorecimento, embriaguez habitual no serviço.\n- **Comissões de Ética:** Objetivo de orientar e aconselhar. A pena aplicável por essa comissão é a de **CENSURA** (decisão fundamentada e escrita).\n\n### 2. LC nº 04/1990 - Estatuto dos Servidores de MT\n- **Provimento:** Nomeação, Promoção, Readaptação, Reversão, Aproveitamento, Reintegração, Recondução.\n- **Estágio Probatório:** Avaliação de aptidão e capacidade para o cargo.\n- **Penalidades Disciplinares:** Advertência, Suspensão, Demissão, Cassação de aposentadoria, Destituição de cargo em comissão.\n- **Demissão:** Aplicada em casos de crime contra a administração pública, abandono de cargo (mais de 30 dias consecutivos), inassiduidade habitual (mais de 60 dias interpolados em 12 meses), improbidade administrativa.\n\n### 3. LC nº 38/1995 - Código Estadual do Meio Ambiente de MT\n- **Foco Central:** Política ambiental estadual de proteção, conservação e melhoria do meio ambiente.\n- **Competências da SEMA:** Fiscalizar, monitorar, licenciar e multar atividades poluidoras.\n- **Licenciamento Ambiental:** Instrumento da Política Estadual (Licença Prévia, de Instalação e de Operação - LP, LI, LO). É exigível para construção, instalação, ampliação e funcionamento de atividades poluidoras.\n- **Infrações:** A responsabilidade administrativa ambiental é autônoma (independe de dolo ou culpa, mas exige nexo causal).\n\n## Checklist de Revisão\n- [ ] Filosofia como busca racional e Tipos de conhecimento\n- [ ] Correntes epistemológicas (Racionalismo, Empirismo, Criticismo)\n- [ ] Pós-verdade, fake news, impacto da IA\n- [ ] Assédio moral e sexual no trabalho\n- [ ] Atitudes éticas no serviço público\n- [ ] Revisão de Atualidades (Meio ambiente, economia, MT)\n- [ ] LC nº 112/2002 (Código de Ética de MT - Focar na CENSURA)\n- [ ] LC nº 04/1990 (Estatuto - Provimento e Demissão/Abandono)\n- [ ] LC nº 38/1995 (Código Ambiental - Licenciamento LP, LI, LO)\n"}, {"id": "06-seguranca", "title": "🔒 Segurança da Informação & LGPD", "category": "Conhecimentos Específicos TI", "fileName": "06 - Segurança da Informação e Privacidade.md", "content": "---\ntags:\n  - seguranca-da-informacao\n  - lgpd\n  - criptografia\n  - ti-especifico\n---\n# 🔒 Segurança da Informação e Privacidade\n\n> [!IMPORTANT]\n> Segurança da Informação e LGPD é um dos eixos temáticos mais cobrados pela Cesgranrio em concursos recentes de TI (Caixa, BNDES e Petrobras), com forte probabilidade de cair na prova discursiva.\n\n---\n\n## 1. Segurança Cibernética e Arquitetura\n\n### 1.1 Zero Trust Architecture (Arquitetura de Confiança Zero)\n* **Princípio Central:** *\"Never Trust, Always Verify\"* (Nunca confie, sempre verifique). Não existe perímetro seguro interno. Qualquer requisição, mesmo originada dentro da rede interna do órgão, deve ser autenticada, autorizada e criptografada.\n* **Pilares Fundamentais:**\n  1. **Verificação Explícita:** Autenticação contínua multifator (MFA) e contexto do dispositivo/usuário.\n  2. **Privilégio Mínimo:** Acesso Just-In-Time (JIT) e Just-Enough-Access (JEA).\n  3. **Pressuposição de Violação (Assume Breach):** Segmentação de rede em microperímetros para conter movimentação lateral de invasores.\n\n### 1.2 Mecanismos de Proteção de Perímetro\n* **Firewall Tradicional vs. Stateful:**\n  - *Packet Filtering (Estático):* Analisa cabeçalhos IP/Porta individualmente sem contexto de estado.\n  - *Stateful Inspection:* Mantém tabela de estado de conexões ativas (permite pacotes de retorno automaticamente).\n  - *Next-Generation Firewall (NGFW):* Inspeciona tráfego na Camada 7 (Aplicação), inclui prevenção contra intrusões (IPS) e controle granular de apps.\n* **IDS (Intrusion Detection System) vs. IPS (Intrusion Prevention System):**\n  - **IDS:** Passivo (analisa cópia do tráfego via porta espelho/SPAN) e gera alertas de incidentes.\n  - **IPS:** Ativo (*in-line* no fluxo de pacotes), detecta e bloqueia ativamente conexões maliciosas em tempo real.\n  - *Métodos de Detecção:* Por assinatura (padrões conhecidos) e por anomalia/heurística (desvio do comportamento basal).\n* **WAF (Web Application Firewall):**\n  - Opera na Camada de Aplicação (Camada 7 do modelo OSI).\n  - Foco específico na proteção de aplicações web contra ataques OWASP Top 10 (SQL Injection, Cross-Site Scripting - XSS, CSRF, Path Traversal).\n\n### 1.3 Análise de Vulnerabilidades e Pentesting\n* **Análise de Vulnerabilidades:** Processo contínuo de varredura automatizada (ex.: Nessus, OpenVAS) para mapear falhas de segurança sem explorá-las.\n* **Testes de Penetração (Pentest):**\n  - *Black Box:* O atacante não possui conhecimento prévio da infraestrutura.\n  - *White Box:* Acesso total a código-fonte, diagramas de rede e credenciais.\n  - *Gray Box:* Conhecimento parcial (simula um usuário interno ou parceiro).\n  - *Fases do Pentest:* Reconhecimento/Footprinting ➔ Varredura (Scanning) ➔ Obtenção de Acesso (Exploitation) ➔ Manutenção de Acesso (Post-Exploitation) ➔ Limpeza e Relatório Executivo/Técnico.\n\n---\n\n## 2. LGPD e Privacidade de Dados\n\n### 2.1 Lei Geral de Proteção de Dados (Lei nº 13.709/2018)\n* **Conceitos Fundamentais:**\n  - **Dado Pessoal:** Informação relacionada a pessoa natural identificada ou identificável.\n  - **Dado Pessoal Sensível:** Origem racial/étnica, convicção religiosa, opinião política, saúde, vida sexual, dado genético ou biométrico.\n  - **Titular:** Pessoa natural a quem se referem os dados pessoais.\n  - **Controlador:** Pessoa natural ou jurídica a quem competem as decisões sobre o tratamento.\n  - **Operador:** Realiza o tratamento de dados pessoais em nome do controlador.\n  - **Encarregado (DPO - Data Protection Officer):** Canal de comunicação entre o controlador, os titulares e a ANPD.\n  - **ANPD:** Autoridade Nacional de Proteção de Dados.\n* **Bases Legais para Tratamento (Art. 7º):**\n  1. Consentimento do titular;\n  2. Cumprimento de obrigação legal ou regulatória pelo controlador;\n  3. Pela administração pública para execução de políticas públicas previstas em lei;\n  4. Realização de estudos por órgão de pesquisa;\n  5. Execução de contrato do qual o titular seja parte;\n  6. Exercício regular de direitos em processo judicial, administrativo ou arbitral;\n  7. Proteção da vida ou da incolumidade física;\n  8. Tutela da saúde;\n  9. Legítimo interesse do controlador (exceto prevalência de direitos fundamentais);\n  10. Proteção do crédito.\n* **Princípios do Tratamento:** Finalidade, adequação, necessidade, livre acesso, qualidade dos dados, transparência, segurança, prevenção, não discriminação e responsabilização/prestação de contas.\n\n---\n\n## 3. Criptografia e PKI\n\n### 3.1 Criptografia Simétrica vs. Assimétrica\n* **Criptografia Simétrica (Chave Secreta Compartilhada):**\n  - Mesma chave para cifrar e decifrar.\n  - *Vantagens:* Extremamente rápida e eficiente para grandes volumes de dados.\n  - *Desvantagens:* Problema do compartilhamento seguro da chave.\n  - *Algoritmos:* AES (Rijndael - padrão mundial de 128, 192 e 256 bits), DES, 3DES, Blowfish.\n* **Criptografia Assimétrica (Par de Chaves Pública e Privada):**\n  - Chave Pública cifra; Chave Privada decifra (ou vice-versa para assinatura digital).\n  - *Vantagens:* Resolve o problema da distribuição de chaves; garante não repúdio e autenticidade.\n  - *Desvantagens:* Processamento computacionalmente pesado (muito lenta).\n  - *Algoritmos:* RSA, ECC (Elliptic Curve Cryptography), Diffie-Hellman (troca de chaves).\n* **Criptografia Híbrida:** Utiliza chave assimétrica para negociar uma chave de sessão simétrica, que então criptografa os dados da comunicação (modelo padrão do HTTPS / TLS).\n\n### 3.2 Funções Hash e Assinatura Digital\n* **Funções Hash Criptográficas:**\n  - Função unidirecional que converte entrada de tamanho arbitrário em string de tamanho fixo (digest).\n  - *Propriedades:* Determinística, efeito avalanche, resistência à pré-imagem e resistência a colisões.\n  - *Algoritmos:* SHA-2 (SHA-256, SHA-512), SHA-3. (MD5 e SHA-1 são obsoletos por vulnerabilidades de colisão).\n* **Assinatura Digital:**\n  - Garante **Autenticidade, Integridade e Não Repúdio**.\n  - *Processo:* Hash do documento cifrado com a **chave privada do emissor**. O receptor decifra o hash usando a **chave pública do emissor** e compara com o hash calculado do documento recebido.\n\n### 3.3 Infraestrutura de Chaves Públicas (PKI e ICP-Brasil)\n* **Certificado Digital X.509:** Documento eletrônico assinado por uma Autoridade Certificadora (AC) que vincula a identidade de uma entidade à sua chave pública.\n* **Estrutura Hierárquica ICP-Brasil:**\n  - **AC Raiz (ITI):** Autoridade Certificadora Raiz da cadeia brasileira.\n  - **Autoridades Certificadoras (ACs):** Emitem, suspendem e revogam certificados digitais.\n  - **Autoridades de Registro (ARs):** Validam presencialmente ou por videoconferência a identidade do titular.\n  - **LCR (Lista de Certificados Revogados) e OCSP:** Protocolos para checagem do status de validade do certificado.\n\n---\n\n## 4. Gestão de Riscos e Continuidade de Negócios\n\n### 4.1 BCP e DRP\n* **BCP (Business Continuity Plan - Plano de Continuidade de Negócios):** Conjunto de procedimentos estratégicos e táticos para garantir que as operações essenciais do órgão continuem em funcionamento durante e após uma interrupção crítica.\n* **DRP (Disaster Recovery Plan - Plano de Recuperação de Desastres):** Subconjunto técnico do BCP focado na restauração de sistemas de TI, bancos de dados e infraestrutura após desastres.\n* **Métricas Fundamentais de Recuperação:**\n  - **RTO (Recovery Time Objective):** Tempo máximo tolerável que um sistema pode permanecer fora do ar antes de causar prejuízos graves.\n  - **RPO (Recovery Point Objective):** Quantidade máxima aceitável de perda de dados expressa em tempo (ex.: perda máxima de até 1 hora de transações).\n\n---\n\n### 📝 Checklist de Revisão\n- [ ] Diferenciar WAF de NGFW e IDS de IPS\n- [ ] Memorizar os 3 princípios do Zero Trust\n- [ ] Dominar as 10 bases legais da LGPD (especialmente administração pública e obrigação legal)\n- [ ] Compreender o fluxo de geração e validação de uma Assinatura Digital\n- [ ] Distinguir claramente RTO de RPO\n"}, {"id": "07-devops", "title": "🚀 DevOps, CI/CD e Metodologias Ágeis", "category": "Conhecimentos Específicos TI", "fileName": "07 - Desenvolvimento de Software e DevOps.md", "content": "---\ntags:\n  - devops\n  - devsecops\n  - docker\n  - kubernetes\n  - metodologias-ageis\n---\n# 🚀 Desenvolvimento de Software e DevOps\n\n> [!NOTE]\n> A cultura DevOps, esteiras CI/CD e orquestração de contêineres são temas consolidados em todas as provas recentes da Fundação Cesgranrio para profissionais de tecnologia.\n\n---\n\n## 1. DevOps e DevSecOps\n\n### 1.1 Princípios e Cultura DevOps (Modelo CAMS)\n* **CAMS:**\n  - **Culture (Cultura):** Colaboração e responsabilidade compartilhada entre desenvolvedores (Dev) e operadores (Ops).\n  - **Automation (Automação):** Eliminação de tarefas manuais repetitivas em testes, builds e deploys.\n  - **Measurement (Métricas):** Monitoramento contínuo de KPIs (DORA metrics: frequência de deploy, tempo de entrega de alterações, tempo médio de recuperação - MTTR e taxa de falha de mudanças).\n  - **Sharing (Compartilhamento):** Transparência, lições aprendidas e disseminação de conhecimento.\n\n### 1.2 DevSecOps (Shift-Left Security)\n* Integração de práticas de segurança desde as fases iniciais do ciclo de desenvolvimento de software (*Shift-Left*).\n* **Testes de Segurança no Pipeline:**\n  - **SAST (Static Application Security Testing):** Análise estática do código-fonte sem execução (ex.: SonarQube).\n  - **DAST (Dynamic Application Security Testing):** Análise dinâmica com a aplicação em execução, testando vulnerabilidades externas (ex.: OWASP ZAP).\n  - **SCA (Software Composition Analysis):** Varredura de bibliotecas e dependências de terceiros contra bancos de dados de vulnerabilidades (CVEs).\n\n### 1.3 CI/CD (Integração e Entrega Contínuas)\n* **Continuous Integration (CI):** Desenvolvedores integram código em um repositório central com frequência. Cada commit dispara build e testes automatizados (unitários e de integração).\n* **Continuous Delivery (CD - Entrega Contínua):** Todo código aprovado no CI é empacotado e preparado para deploy, com o envio para produção dependendo de **aprovação manual**.\n* **Continuous Deployment (CD - Implantação Contínua):** Todo commit que passa com sucesso pelo pipeline de testes é **implantado automaticamente** em produção, sem intervenção humana.\n\n---\n\n## 2. Ferramentas: Git, Docker e Kubernetes\n\n### 2.1 Controle de Versão com Git\n* **Conceito dos 3 Estados:** Working Directory ➔ Staging Area (Index) ➔ Repository (.git).\n* **Comandos Fundamentais:**\n  - `git commit --amend`: Altera o último commit.\n  - `git rebase`: Reaplica commits sobre outra base, criando histórico linear.\n  - `git merge`: Combina ramificações criando um commit de mesclagem.\n  - `git cherry-pick`: Aplica um commit específico de outra branch na branch atual.\n  - `git stash`: Armazena alterações não commitadas temporariamente.\n\n### 2.2 Contêineres com Docker\n* **Contêiner vs. Máquina Virtual (VM):**\n  - VMs virtualizam o hardware físico (hipervisor + sistema operacional convidado completo em cada VM).\n  - Contêineres compartilham o **Kernel do Sistema Operacional hospedeiro**, isolando processos via *namespaces* e *cgroups* do Linux. São leves, rápidos e inicializam em segundos.\n* **Componentes Docker:**\n  - `Dockerfile`: Arquivo declarativo com instruções de construção da imagem (`FROM`, `RUN`, `COPY`, `CMD`, `ENTRYPOINT`).\n  - `Image`: Template imutável somente leitura.\n  - `Container`: Instância em execução de uma imagem.\n  - `Volumes`: Persistência de dados independente do ciclo de vida do contêiner.\n\n### 2.3 Orquestração com Kubernetes (K8s)\n* **Arquitetura do Cluster:**\n  - **Control Plane:** `kube-apiserver` (ponto de entrada da API), `etcd` (armazenamento chave-valor consistente do estado do cluster), `kube-scheduler` (aloca Pods nos nós), `kube-controller-manager`.\n  - **Worker Nodes:** `kubelet` (agente que garante a execução dos contêineres no nó), `kube-proxy` (gerencia regras de rede), Container Runtime.\n* **Objetos Principais:**\n  - **Pod:** Menor unidade implantável no Kubernetes (pode conter um ou mais contêineres que compartilham IP e volumes).\n  - **Deployment:** Gerencia a implantação declarativa, réplicas e atualizações (*rolling updates*) dos Pods.\n  - **Service:** Abstração que define uma política de acesso aos Pods via IP fixo e DNS interno (`ClusterIP`, `NodePort`, `LoadBalancer`).\n  - **Ingress:** Gerencia o acesso externo (roteamento HTTP/HTTPS) aos serviços dentro do cluster.\n  - **ConfigMap / Secret:** Separam configurações e credenciais sensíveis do código da imagem.\n\n---\n\n## 3. Metodologias Ágeis\n\n### 3.1 Scrum (Guia Scrum Atual)\n* **Papéis:**\n  - **Product Owner (PO):** Maximiza o valor do produto; proprietário exclusivo do Product Backlog.\n  - **Scrum Master:** Líder servidor; remove impedimentos e garante a eficácia das práticas do Scrum.\n  - **Desenvolvedores:** Criam qualquer aspecto de um Incremento utilizável em cada Sprint.\n* **Artefatos e Seus Compromissos:**\n  - *Product Backlog* ➔ Meta do Produto (Product Goal).\n  - *Sprint Backlog* ➔ Meta da Sprint (Sprint Goal).\n  - *Incremento* ➔ Definição de Pronto (Definition of Done - DoD).\n* **Eventos:** Sprint (1 a 4 semanas), Sprint Planning, Daily Scrum (15 min), Sprint Review, Sprint Retrospective.\n\n### 3.2 Kanban\n* Foco no fluxo contínuo de trabalho.\n* **Práticas Fundamentais:**\n  1. Visualizar o fluxo de trabalho (quadro Kanban);\n  2. Limitar o trabalho em progresso (**WIP - Work In Progress**);\n  3. Gerenciar o fluxo (Lead Time e Cycle Time);\n  4. Tornar as políticas explícitas;\n  5. Ciclos de feedback contínuos.\n\n### 3.3 eXtreme Programming (XP)\n* Metodologia focada na excelência técnica de desenvolvimento de software.\n* **Práticas Técnicas de Engenharia:**\n  - **TDD (Test-Driven Development):** Escrever o teste que falha (Red), escrever código mínimo para passar (Green), refatorar (Refactor).\n  - **Programação em Par (Pair Programming):** Dois desenvolvedores na mesma estação (Piloto e Copiloto).\n  - **Refatoração Contínua:** Melhoria do design do código sem alterar seu comportamento externo.\n  - **Integração Contínua:** Múltiplas integrações diárias.\n  - **Releases Pequenos:** Entregas rápidas e frequentes em produção.\n\n---\n\n### 📝 Checklist de Revisão\n- [ ] Diferenciar VM de Contêiner Docker\n- [ ] Saber as funções do `kube-apiserver`, `etcd`, `kubelet` e `Pod` no Kubernetes\n- [ ] Conhecer os 3 papéis, 3 artefatos e 5 eventos do Scrum\n- [ ] Entender a diferença entre SAST, DAST e SCA em DevSecOps\n- [ ] Compreender o ciclo Red-Green-Refactor do TDD\n"}, {"id": "08-arquitetura", "title": "🏛️ Arquitetura de Software e APIs", "category": "Conhecimentos Específicos TI", "fileName": "08 - Arquitetura de Software e APIs.md", "content": "---\ntags:\n  - arquitetura-de-software\n  - microsservicos\n  - apis\n  - design-patterns\n---\n# 🏛️ Arquitetura de Software e APIs\n\n---\n\n## 1. Padrões Arquiteturais: Monólito vs. Microsserviços vs. SOA\n\n### 1.1 Arquitetura Monolítica\n* Todo o sistema (interface, regras de negócio e camada de dados) é construído e empacotado como uma **única unidade executável**.\n* *Vantagens:* Simplicidade inicial de desenvolvimento, facilidade de testes ponta a ponta e implantação inicial única.\n* *Desvantagens:* Acoplamento elevado, escalabilidade de todo o sistema em bloco, barreiras para adotar novas tecnologias e risco de falha catastrófica (uma falha derruba todo o sistema).\n\n### 1.2 Arquitetura de Microsserviços\n* Aplicação decomposta em um conjunto de serviços autônomos, de escopo reduzido (alinhados a domínios de negócio - DDD), fracamente acoplados e implantáveis de forma independente.\n* **Características:**\n  - Banco de dados descentralizado (*Database-per-service*).\n  - Comunicação via protocolos leves (HTTP/REST, gRPC, filas AMQP/Kafka).\n  - Tolerância a falhas com padrões de resiliência (*Circuit Breaker*, *Retry*, *Fallback*).\n  - *Desafio:* Alta complexidade operacional de orquestração, rastreabilidade distribuída (Tracing) e consistência eventual de dados (Padrão Saga).\n\n### 1.3 SOA (Service-Oriented Architecture)\n* Foco na integração e reutilização de serviços corporativos em escala organizacional.\n* Uso típico de um **ESB (Enterprise Service Bus)** centralizado para mediar comunicação, roteamento e transformação de protocolos. Contratos estritos baseados em XML e WSDL.\n\n---\n\n## 2. APIs: REST vs. SOAP\n\n| Critério | REST (Representational State Transfer) | SOAP (Simple Object Access Protocol) |\n| :--- | :--- | :--- |\n| **Protocolo/Estilo** | Estilo arquitetural sobre HTTP | Protocolo formal padronizado pelo W3C |\n| **Formato de Dados** | Múltiplos formatos (JSON é o padrão de fato, XML, texto) | Exclusivamente **XML** |\n| **Estado** | **Stateless** (sem estado mantido no servidor entre requisições) | Pode ser stateful ou stateless |\n| **Segurança** | HTTPS/TLS, OAuth 2.0, JWT | WS-Security (segurança em nível de mensagem), ACID |\n| **Consumo de Banda**| Muito leve e rápido | Mais pesado devido aos envelopes XML |\n\n### 2.1 Princípios REST e Métodos HTTP\n* **Restrições Arquiteturais do REST:**\n  1. Cliente-Servidor;\n  2. Stateless (sem estado);\n  3. Cacheable (respostas explicitamente definem se são armazenáveis em cache);\n  4. Interface Uniforme (identificação de recursos por URIs, HATEOAS);\n  5. Sistema em Camadas.\n* **Métodos HTTP e Idempotência:**\n  - `GET`: Recupera representação do recurso (Seguro e Idempotente).\n  - `POST`: Cria um novo recurso (Não seguro e Não idempotente).\n  - `PUT`: Substitui integralmente o recurso ou cria caso não exista (Idempotente).\n  - `PATCH`: Atualização parcial do recurso (Geralmente não idempotente).\n  - `DELETE`: Remove o recurso (Idempotente).\n* **Códigos de Status HTTP mais cobrados:**\n  - `200 OK`, `201 Created`, `204 No Content`.\n  - `301 Moved Permanently`, `304 Not Modified`.\n  - `400 Bad Request`, `401 Unauthorized` (falta autenticação), `403 Forbidden` (sem permissão), `404 Not Found`.\n  - `500 Internal Server Error`, `502 Bad Gateway`, `503 Service Unavailable`.\n\n---\n\n## 3. Padrões de Projeto de Software (GoF - Gang of Four)\n\nDivididos em 3 categorias clássicas:\n\n### 3.1 Padrões Criacionais (Criação de Objetos)\n* **Singleton:** Garante que uma classe tenha apenas uma única instância e fornece um ponto de acesso global a ela.\n* **Factory Method:** Define uma interface para criar um objeto, mas deixa as subclasses decidirem qual classe instanciar.\n* **Abstract Factory:** Cria famílias de objetos relacionados ou dependentes sem especificar suas classes concretas.\n* **Builder:** Separa a construção de um objeto complexo da sua representação, permitindo o mesmo processo construir diferentes representações.\n* **Prototype:** Cria novos objetos clonando uma instância existente.\n\n### 3.2 Padrões Estruturais (Composição de Classes e Objetos)\n* **Adapter:** Converte a interface de uma classe em outra interface esperada pelos clientes (funciona como um adaptador de tomada).\n* **Decorator:** Agrega dinamicamente responsabilidades adicionais a um objeto sem alterar sua classe.\n* **Facade:** Fornece uma interface simplificada e unificada para um subsistema complexo.\n* **Proxy:** Fornece um substituto ou ponto de controle para acessar outro objeto (ex.: cache, segurança, lazy loading).\n\n### 3.3 Padrões Comportamentais (Interação e Algoritmos)\n* **Strategy:** Define uma família de algoritmos, encapsula cada um e os torna intercambiáveis em tempo de execução.\n* **Observer:** Define uma dependência um-para-muitos entre objetos, de forma que quando um objeto muda de estado, todos os seus dependentes são notificados automaticamente (padrão Publish/Subscribe).\n* **Chain of Responsibility:** Evita o acoplamento do remetente de uma requisição ao seu receptor, encadeando objetos receptores.\n* **Command:** Encapsula uma requisição como um objeto, permitindo parametrizar clientes com diferentes requisições, enfileirar ou registrar operações de log e suportar desfazimento (Undo).\n\n---\n\n### 📝 Checklist de Revisão\n- [ ] Saber a diferença conceitual e prática entre Monólito e Microsserviços\n- [ ] Conhecer os métodos HTTP idempotentes (GET, PUT, DELETE)\n- [ ] Identificar a diferença entre os status HTTP 401 e 403\n- [ ] Memorizar os propósitos de Singleton, Factory, Strategy, Observer e Decorator\n"}, {"id": "09-ia-dados", "title": "🧠 Inteligência Artificial & Ciência de Dados", "category": "Conhecimentos Específicos TI", "fileName": "09 - Inteligência Artificial e Ciência de Dados.md", "content": "---\ntags:\n  - inteligencia-artificial\n  - machine-learning\n  - deep-learning\n  - nlp\n  - dados\n---\n# 🧠 Inteligência Artificial (IA) e Dados\n\n> [!NOTE]\n> A Cesgranrio incluiu explicitamente no edital tópicos de IA Generativa, Processamento de Linguagem Natural (NLP) e Aprendizado de Máquina, refletindo as inovações tecnológicas dos órgãos de controle e fiscalização ambiental.\n\n---\n\n## 1. Machine Learning (Aprendizado de Máquina)\n\n### 1.1 Paradigmas de Aprendizado\n* **Aprendizado Supervisionado:**\n  - O modelo é treinado com dados rotulados (pares de entrada e saída esperada).\n  - *Classificação:* A saída é uma variável discreta/categórica (ex.: identificar se uma imagem contém desmatamento: Sim/Não). Algoritmos: Regressão Logística, Árvores de Decisão, Random Forest, SVM (Support Vector Machines), Naive Bayes, KNN.\n  - *Regressão:* A saída é um valor contínuo/numérico (ex.: previsão do valor de um imóvel ou volume de água). Algoritmos: Regressão Linear, Ridge, Lasso.\n* **Aprendizado Não Supervisionado:**\n  - O modelo busca padrões, estruturas ou agrupamentos intrínsecos em dados **não rotulados**.\n  - *Clustering (Agrupamento):* K-Means, DBSCAN, Agrupamento Hierárquico.\n  - *Redução de Dimensionalidade:* PCA (Principal Component Analysis), t-SNE.\n* **Aprendizado por Reforço:**\n  - Um agente aprende a tomar decisões em um ambiente interagindo por tentativa e erro, recebendo **recompensas** por ações desejadas ou **penalidades** por erros. Algoritmos: Q-Learning, Deep Q-Networks (DQN).\n\n### 1.2 Métricas de Avaliação de Modelos\n* **Matriz de Confusão:**\n  - **Acurácia:** Proporção de predições corretas sobre o total.\n  - **Precisão:** $TP / (TP + FP)$ — Dentre as previsões positivas, quantas eram realmente positivas.\n  - **Recall (Sensibilidade):** $TP / (TP + FN)$ — Dentre os casos reais positivos, quantos o modelo conseguiu detectar.\n  - **F1-Score:** Média harmônica entre Precisão e Recall: $2 \times \frac{\text{Precisão} \times \text{Recall}}{\text{Precisão} + \text{Recall}}$.\n  - **Curva ROC / AUC:** Relação entre taxa de verdadeiros positivos e falsos positivos em diferentes limiares.\n\n---\n\n## 2. Deep Learning e Redes Neurais Artificiais\n\n### 2.1 Conceitos Básicos\n* **Perceptron:** Unidade básica de computação neural (soma ponderada das entradas com pesos + bias, passando por uma função de ativação).\n* **MLP (Multilayer Perceptron):** Rede neural feedforward com camada de entrada, camadas ocultas e camada de saída.\n* **Backpropagation:** Algoritmo fundamental que calcula o gradiente da função de perda em relação a cada peso da rede para ajuste via otimizadores (Gradiente Descendente, Adam).\n* **Funções de Ativação:**\n  - *Sigmoid:* Converte valores para intervalo (0, 1) — útil para probabilidades binárias.\n  - *ReLU (Rectified Linear Unit):* $f(x) = \\max(0, x)$ — padrão nas camadas ocultas por evitar o problema de desaparecimento do gradiente.\n  - *Softmax:* Converte vetor de números reais em distribuição de probabilidades para classes múltiplas (soma = 1).\n\n### 2.2 Arquiteturas Especializadas\n* **CNN (Convolutional Neural Networks):** Especializadas no processamento de dados em grade espacial (imagens). Utilizam operações de convolução, pooling e camadas densas (essencial para **Visão Computacional** e imagens de satélite).\n* **RNN / LSTM / GRU:** Redes neurais recorrentes projetadas para lidar com dados sequenciais e temporais (séries temporais, texto).\n* **Transformers & LLMs:** Arquitetura baseada em mecanismos de **Atenção (Self-Attention)** que superou as RNNs. É a base de modelos de linguagem modernos (BERT, GPT, LLaMA).\n\n---\n\n## 3. Processamento de Linguagem Natural (NLP) e Visão Computacional\n\n### 3.1 Etapas de Processamento de Texto em NLP\n1. **Tokenização:** Divisão do texto em palavras, subpalavras ou caracteres.\n2. **Stopwords:** Remoção de palavras muito frequentes sem conteúdo semântico exclusivo (artigos, preposições).\n3. **Lematização vs. Stemming:**\n   - *Stemming:* Corte mecânico de sufixos/prefixos para obter o radical (pode gerar palavras inexistentes).\n   - *Lematização:* Redução da palavra ao seu lema morfológico oficial de dicionário (ex.: \"estudando\" ➔ \"estudar\").\n4. **Embeddings:** Representações vetoriais densas de palavras ou frases no espaço semântico contínuo (Word2Vec, FastText, BERT embeddings).\n\n### 3.2 Visão Computacional\n* Aplicação na SEMA: Monitoramento remoto de desmatamento, queimadas e invasões territoriais a partir de imagens aéreas e de satélite.\n* Técnicas: Filtragem espacial, detecção de bordas, segmentação semântica e classificação de objetos.\n\n---\n\n### 📝 Checklist de Revisão\n- [ ] Saber classificar problemas entre Supervisionado, Não Supervisionado e Reforço\n- [ ] Dominar a Matriz de Confusão e o cálculo de Precisão, Recall e F1-Score\n- [ ] Compreender o papel da função de ativação ReLU e Softmax\n- [ ] Entender a aplicação prática de CNNs em Visão Computacional\n"}, {"id": "10-bigdata-bi", "title": "📊 Big Data, NoSQL e BI", "category": "Conhecimentos Específicos TI", "fileName": "10 - Big Data e Business Intelligence.md", "content": "---\ntags:\n  - big-data\n  - bi\n  - nosql\n  - hadoop\n---\n# 📊 Big Data e Business Intelligence (BI)\n\n---\n\n## 1. Big Data e Bancos NoSQL\n\n### 1.1 Os \"Vs\" do Big Data\n* **Volume:** Quantidade massiva de terabytes, petabytes ou exabytes de dados gerados.\n* **Velocidade:** Taxa acelerada com que novos dados são produzidos e precisam ser processados (tempo real / streaming).\n* **Variedade:** Diversidade de formatos: estruturados (tabelas relacionais), semiestruturados (JSON, XML) e não estruturados (áudios, vídeos, imagens).\n* **Veracidade:** Confiabilidade e precisão dos dados coletados.\n* **Valor:** O retorno e benefício de negócio extraído dos dados para a tomada de decisão.\n\n### 1.2 Ecossistema NoSQL e Teorema CAP\n* **Teorema CAP (Brewer):** Em um sistema distribuído de dados, é impossível garantir simultaneamente mais de duas das seguintes propriedades:\n  - **C (Consistência):** Todos os nós enxergam os mesmos dados no mesmo instante.\n  - **A (Disponibilidade):** Toda requisição recebe uma resposta (sem erro), mesmo que não garanta o dado mais recente.\n  - **P (Tolerância a Partições):** O sistema continua operando mesmo se houver falha de comunicação entre os nós de rede. *(Em redes distribuídas, a tolerância a partições é mandatória; logo, escolhe-se entre CP ou AP)*.\n* **Categorias de Bancos NoSQL:**\n  1. **Orientados a Documentos:** Armazenam dados em documentos JSON/BSON com esquema flexível (ex.: MongoDB, CouchDB).\n  2. **Chave-Valor (Key-Value):** Armazenamento simples e ultrarrápido baseado em pares chave-valor em memória (ex.: Redis, Memcached).\n  3. **Família de Colunas (Wide-Column):** Otimizados para consultas analíticas sobre grandes volumes (ex.: Apache Cassandra, HBase).\n  4. **Orientados a Grafos:** Modelam relacionamentos complexos com nós e arestas (ex.: Neo4j).\n\n### 1.3 Ecossistema Hadoop\n* **HDFS (Hadoop Distributed File System):** Sistema de arquivos distribuído baseado em arquitetura Master/Worker:\n  - *NameNode (Master):* Gerencia os metadados do sistema de arquivos e a localização dos blocos.\n  - *DataNodes (Workers):* Armazenam os blocos reais de dados e replicam blocos para tolerância a falhas.\n* **MapReduce:** Modelo de programação para processamento massivo distribuído dividido em duas funções: `Map()` (filtra e transforma) e `Reduce()` (agrega e totaliza).\n\n---\n\n## 2. Business Intelligence (BI) e Data Warehouse\n\n### 2.1 Conceitos e Arquitetura de BI\n* **OLTP (Online Transaction Processing):** Bancos relacionais tradicionais, altamente normalizados, voltados para operações rápidas de gravação/atualização no dia a dia.\n* **OLAP (Online Analytical Processing):** Sistemas analíticos, desnormalizados, otimizados para consultas complexas e agregação de históricos.\n* **Data Warehouse (DW):** Repositório centralizado de dados integrados, orientados por assunto, integrados, variantes no tempo e não voláteis.\n* **Data Lake:** Repositório que armazena grandes volumes de dados em seu formato bruto (*raw*), estruturados ou não.\n\n### 2.2 Processos de Integração: ETL vs. ELT\n* **ETL (Extract, Transform, Load):** Dados são extraídos da fonte, transformados em um servidor de processamento intermediário (Staging) e carregados no Data Warehouse.\n* **ELT (Extract, Load, Transform):** Dados são extraídos e carregados diretamente no Data Lake / DW moderno (nuvem), aproveitando o poder de processamento do próprio destino para transformá-los.\n\n### 2.3 Modelagem Dimensional (Kimball)\n* **Tabela Fato:** Contém métricas quantitativas de negócio (fatos numéricos) e chaves estrangeiras que apontam para tabelas dimensão. Ex.: quantidade de autuações ambientais, valores de multas.\n* **Tabela Dimensão:** Contém o contexto descritivo das métricas (tempo, localização, tipo de fiscalizado, agente).\n* **Esquema Estrela (Star Schema):** Tabela fato central conectada diretamente a dimensões **totalmente desnormalizadas**. Consultas mais simples e com menos JOINs.\n* **Esquema Floco de Neve (Snowflake Schema):** As dimensões são **normalizadas** em subtabelas. Reduz redundância, mas exige mais operações de JOIN nas consultas.\n\n---\n\n### 📝 Checklist de Revisão\n- [ ] Memorizar os 5 Vs do Big Data\n- [ ] Entender o trade-off do Teorema CAP (CP vs. AP)\n- [ ] Distinguir OLTP de OLAP\n- [ ] Comparar Star Schema com Snowflake Schema\n"}, {"id": "11-emergentes", "title": "🌐 IoT, Edge Computing & Blockchain", "category": "Conhecimentos Específicos TI", "fileName": "11 - Tecnologias Emergentes (IoT e Blockchain).md", "content": "---\ntags:\n  - iot\n  - edge-computing\n  - blockchain\n  - tecnologias-emergentes\n---\n# 🌐 Tecnologias Emergentes (IoT e Blockchain)\n\n---\n\n## 1. Internet das Coisas (IoT) e Edge Computing\n\n### 1.1 Arquitetura e Componentes de IoT\n* **Camada de Percepção (Sensoriamento):** Sensores (temperatura, umidade, fumaça, qualidade da água) e atuadores que interagem com o ambiente físico.\n* **Camada de Rede (Gateways):** Dispositivos intermediários que agregam dados dos sensores locais e realizam a ponte com redes de longa distância.\n* **Camada de Nuvem / Aplicação:** Plataformas centrais que armazenam, processam e exibem dashboards analíticos dos dados coletados.\n* **Protocolos Típicos de IoT:**\n  - **MQTT (Message Queuing Telemetry Transport):** Protocolo extremamente leve baseado no padrão Publish/Subscribe sobre TCP. Ideal para dispositivos com recursos restritos e redes de baixa largura de banda.\n  - **CoAP (Constrained Application Protocol):** Protocolo baseado em REST sobre UDP para nós com restrição de processamento.\n  - **LoRaWAN:** Rede sem fio de longo alcance e baixo consumo de energia (LPWAN).\n\n### 1.2 Edge Computing (Computação de Borda)\n* Processamento de dados realizado fisicamente próximo à fonte geradora dos dados (no gateway ou no próprio sensor), em vez de enviar tudo para servidores centrais na nuvem.\n* *Benefícios:* Redução drástica da latência, economia de largura de banda e operação local contínua mesmo sem conexão com a internet.\n\n---\n\n## 2. Blockchain e Criptoativos\n\n### 2.1 Livro-Razão Distribuído (Distributed Ledger)\n* Estrutura de dados descentralizada onde múltiplos nós mantêm cópias sincronizadas e criptograficamente verificadas do histórico de transações.\n* **Encadeamento de Blocos:** Cada bloco contém um conjunto de transações válidas, seu próprio hash criptográfico e o **hash do bloco anterior**. Qualquer tentativa de alterar um bloco anterior invalida todos os blocos subsequentes.\n\n### 2.2 Mecanismos de Consenso\n* **Proof of Work (PoW):** Mineradores competem para resolver um enigma matemático complexo computacionalmente (alto consumo energético; usado no Bitcoin).\n* **Proof of Stake (PoS):** Validadores são selecionados proporcionalmente à quantidade de ativos mantidos em custódia (staking). Muito mais eficiente energeticamente (usado no Ethereum moderno).\n* **Algoritmos Tolerantes a Falhas Bizantinas (PBFT / Raft):** Usados em redes permissionadas e privadas corporativas (ex.: Hyperledger Fabric).\n\n### 2.3 Smart Contracts (Contratos Inteligentes)\n* Programas de computador autoexecutáveis armazenados na blockchain que executam termos e cláusulas contratuais de forma autônoma e imutável quando condições pré-definidas são satisfeitas.\n\n---\n\n### 📝 Checklist de Revisão\n- [ ] Entender a arquitetura Publish/Subscribe do protocolo MQTT\n- [ ] Diferenciar Edge Computing de Cloud Computing\n- [ ] Compreender como o hash do bloco anterior garante a imutabilidade na Blockchain\n- [ ] Distinguir PoW de PoS\n"}, {"id": "12-governanca", "title": "🏛️ Governança de TI (ITIL e COBIT)", "category": "Conhecimentos Específicos TI", "fileName": "12 - Governança e Gestão de TI (ITIL e COBIT).md", "content": "---\ntags:\n  - governanca-ti\n  - itil\n  - cobit\n  - itsm\n---\n# 🏛️ Governança e Gestão de TI (ITIL e COBIT)\n\n> [!IMPORTANT]\n> ITIL e COBIT são matérias certas na prova de TI da Cesgranrio. A banca costuma cobrar cenários práticos para identificar o processo ou prática responsável.\n\n---\n\n## 1. Gestão de Serviços de TI — ITIL 4\n\n### 1.1 Conceito de Serviço e Valor\n* **Serviço:** Meio de possibilitar a **co-criação de valor**, facilitando os resultados que os clientes desejam alcançar, sem que tenham de gerenciar custos e riscos específicos.\n* **Sistema de Valor de Serviço (SVS):** Descreve como todos os componentes e atividades da organização trabalham juntos para permitir a criação de valor.\n* **Os 7 Princípios Orientadores do ITIL 4:**\n  1. Foco no valor (*Focus on value*);\n  2. Começar de onde você está (*Start where you are*);\n  3. Progredir iterativamente com feedback (*Progress iteratively with feedback*);\n  4. Colaborar e promover visibilidade (*Collaborate and promote visibility*);\n  5. Pensar e trabalhar holisticamente (*Think and work holistically*);\n  6. Manter simples e prático (*Keep it simple and practical*);\n  7. Otimizar e automatizar (*Optimize and automate*).\n\n### 1.2 Práticas de Gerenciamento Essenciais\n* **Gerenciamento de Incidentes:**\n  - *Objetivo:* Restaurar a operação normal do serviço o mais rápido possível e minimizar o impacto adverso nas operações do órgão.\n  - Foco na **velocidade de resolução**, mesmo que com soluções de contorno (*workarounds*).\n* **Gerenciamento de Problemas:**\n  - *Objetivo:* Reduzir a probabilidade e o impacto de incidentes, identificando as causas reais e potenciais de incidentes e gerenciando soluções de contorno e erros conhecidos (*Known Errors*).\n  - Três fases: Identificação de problemas ➔ Controle de problemas (investigação de causa raiz) ➔ Controle de erros.\n* **Habilitação de Mudanças (Change Enablement):**\n  - *Objetivo:* Maximizar o número de mudanças bem-sucedidas em serviços e produtos, garantindo que os riscos sejam avaliados adequadamente.\n  - Tipos de Mudança:\n    - *Mudança Padrão:* Baixo risco, pré-autorizada, rotineira e bem compreendida.\n    - *Mudança Normal:* Precisa ser agendada, avaliada e autorizada por uma autoridade de mudança.\n    - *Mudança Emergencial:* Deve ser implementada o mais rápido possível para resolver um incidente grave (autorização acelerada via comitê de emergência).\n* **Gerenciamento de Configuração de Serviço (CMDB):**\n  - Mantém informações precisas e confiáveis sobre a configuração dos serviços e os itens de configuração (CIs) que os suportam.\n\n---\n\n## 2. Governança de TI — COBIT 2019\n\n### 2.1 Governança vs. Gestão\n* **Governança:**\n  - De competência do Conselho / Alta Administração.\n  - Avalia as necessidades das partes interessadas, direciona as prioridades através de diretrizes e monitora a conformidade e o desempenho (Ciclo **EDM**: *Evaluate, Direct, Monitor*).\n* **Gestão:**\n  - De competência da Diretoria Executiva / Gerência de TI.\n  - Planeja, constrói, executa e monitora as atividades alinhadas à direção estabelecida pela governança.\n\n### 2.2 Os 5 Domínios de Objetivos do COBIT 2019\n1. **EDM (Evaluate, Direct and Monitor):** Domínio exclusivo de **Governança**.\n2. **APO (Align, Plan and Organize):** Domínio de Gestão voltado à estratégia global e organização de TI.\n3. **BAI (Build, Acquire and Implement):** Domínio de Gestão focado na definição de requisitos e implementação de soluções de TI.\n4. **DSS (Deliver, Service and Support):** Domínio de Gestão responsável pela execução operacional dos serviços e segurança.\n5. **MEA (Monitor, Evaluate and Assess):** Domínio de Gestão voltado ao monitoramento do desempenho interno e conformidade regulatória.\n\n---\n\n### 📝 Checklist de Revisão\n- [ ] Diferenciar Incidente (interrupção/restauração rápida) de Problema (causa raiz/solução definitiva)\n- [ ] Conhecer os 3 tipos de mudanças no ITIL (Padrão, Normal, Emergencial)\n- [ ] Dominar a diferença entre Governança (EDM) e Gestão no COBIT 2019\n- [ ] Memorizar os 5 domínios do COBIT 2019\n"}, {"id": "13-algoritmos", "title": "🧩 Estruturas de Dados e Algoritmos", "category": "Fundamentos de TI", "fileName": "13 - Estrutura de Dados e Algoritmos.md", "content": "---\ntags:\n  - estrutura-de-dados\n  - algoritmos\n  - complexidade\n---\n# 🧩 Estrutura de Dados e Algoritmos\n\n---\n\n## 1. Estruturas de Dados Lineares e Não Lineares\n\n### 1.1 Listas, Pilhas e Filas\n* **Lista Encadeada (Linked List):** Elementos (nós) contêm dados e ponteiros para o próximo elemento. Inserção no início é $O(1)$.\n* **Pilha (Stack):** Política **LIFO (Last In, First Out)**. Operações: `push()` (inserir no topo) e `pop()` (remover do topo) em $O(1)$. Aplicações: chamadas recursivas, avaliação de expressões matemáticas, desfazimento (Ctrl+Z).\n* **Fila (Queue):** Política **FIFO (First In, First Out)**. Operações: `enqueue()` (inserir no final) e `dequeue()` (remover do início) em $O(1)$. Aplicações: filas de impressão, buffers de rede, escalonamento de processos.\n\n### 1.2 Tabelas Hash (Hash Tables)\n* Mapeamento chave-valor indexado através de uma função hash.\n* Desempenho médio para inserção, busca e remoção: **$O(1)$**.\n* *Tratamento de Colisões:*\n  - **Encadeamento Aberto/Separado:** Cada posição da tabela aponta para uma lista encadeada com os elementos que colidiram.\n  - **Endereçamento Aberto:** Procura outra posição livre na própria tabela (Sondagem Linear, Quadrática ou Duplo Hashing).\n\n### 1.3 Árvores\n* **Árvore Binária de Busca (BST):** Para todo nó $N$, os nós da subárvore esquerda têm valores menores que $N$, e os da subárvore direita têm valores maiores. Busca média: $O(\\log n)$; pior caso (degenerada em lista): $O(n)$.\n* **Árvore AVL:** Árvore binária de busca **auto-balanceada**. A diferença de altura entre subárvores de qualquer nó (fator de balanceamento) deve ser $-1, 0$ ou $+1$. Mantém busca em **$O(\\log n)$** no pior caso através de rotações simples e duplas.\n* **Árvores B / B+:** Árvores balanceadas multicaminho (cada nó pode ter muitos filhos e chaves). Amplamente utilizadas em **sistemas de arquivos e índices de bancos de dados relacionais** para minimizar acessos a disco.\n\n---\n\n## 2. Algoritmos de Ordenação e Busca\n\n### 2.1 Comparativo de Algoritmos de Ordenação\n\n| Algoritmo | Melhor Caso | Caso Médio | Pior Caso | Estável? | Estratégia |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **Bubble Sort** | $O(n)$ | $O(n^2)$ | $O(n^2)$ | Sim | Comparações adjacentes |\n| **Insertion Sort** | $O(n)$ | $O(n^2)$ | $O(n^2)$ | Sim | Inserção progressiva |\n| **Selection Sort** | $O(n^2)$ | $O(n^2)$ | $O(n^2)$ | Não | Seleciona o menor |\n| **Merge Sort** | $O(n \\log n)$ | $O(n \\log n)$ | $O(n \\log n)$ | Sim | Dividir para Conquistar |\n| **Quick Sort** | $O(n \\log n)$ | $O(n \\log n)$ | $O(n^2)$ | Não | Particionamento com Pivô |\n| **Heap Sort** | $O(n \\log n)$ | $O(n \\log n)$ | $O(n \\log n)$ | Não | Estrutura de Heap Máximo |\n\n### 2.2 Algoritmos de Busca\n* **Busca Linear:** Percorre elemento por elemento. Funciona em arrays desordenados. Complexidade: $O(n)$.\n* **Busca Binária:** Exige que a coleção esteja previamente **ordenada**. Divide o espaço de busca pela metade a cada passo. Complexidade: **$O(\\log n)$**.\n\n---\n\n## 3. Notação Assintótica Big-O\n\n* Classificação da taxa de crescimento do tempo de execução ou espaço de memória conforme o tamanho da entrada $n$:\n  - $O(1)$: Tempo constante (acesso direto a array por índice, hash ideal).\n  - $O(\\log n)$: Tempo logarítmico (busca binária).\n  - $O(n)$: Tempo linear (percorrer lista simples).\n  - $O(n \\log n)$: Linear-logarítmico (Merge Sort, Heap Sort).\n  - $O(n^2)$: Tempo quadrático (laços aninhados, Bubble Sort).\n  - $O(2^n)$: Tempo exponencial (força bruta, Fibonacci ingênuo).\n\n---\n\n### 📝 Checklist de Revisão\n- [ ] Distinguir Pilha (LIFO) de Fila (FIFO)\n- [ ] Saber as complexidades do Merge Sort ($O(n \\log n)$ sempre) e Quick Sort (pior caso $O(n^2)$)\n- [ ] Entender a condição necessária para aplicar Busca Binária (dados ordenados)\n- [ ] Conhecer o fator de balanceamento da Árvore AVL (-1, 0, 1)\n"}, {"id": "14-so-redes", "title": "💻 Sistemas Operacionais (Linux/Windows)", "category": "Fundamentos de TI", "fileName": "14 - Sistemas Operacionais e Redes.md", "content": "---\ntags:\n  - sistemas-operacionais\n  - linux\n  - windows-server\n  - active-directory\n---\n# 💻 Sistemas Operacionais e Infraestrutura\n\n---\n\n## 1. Fundamentos de Sistemas Operacionais\n\n### 1.1 Gerenciamento de Processos e Threads\n* **Processo:** Programa em execução com espaço de endereçamento de memória próprio e recursos alocados.\n* **Thread:** Linha de execução dentro de um processo. Múltiplas threads do mesmo processo compartilham memória e recursos (menor custo de troca de contexto).\n* **Estados de um Processo:**\n  - *Novo (New):* Sendo criado.\n  - *Pronto (Ready):* Aguardando alocação da CPU pelo escalonador.\n  - *Executando (Running):* Instruções sendo processadas pela CPU.\n  - *Bloqueado/Espera (Waiting):* Aguardando evento de E/S ou sinal.\n  - *Terminado (Terminated):* Execução concluída e recursos liberados.\n* **Escalonamento de Processos:**\n  - *Preemptivo:* O SO pode interromper um processo em execução para ceder a CPU a outro (ex.: Round Robin com quantum de tempo, Múltiplas Filas).\n  - *Não Preemptivo (Cooperativo):* O processo mantém a CPU até terminar ou bloquear voluntariamente (ex.: FIFO / FCFS, SJF simples).\n\n### 1.2 Gerenciamento de Memória\n* **Memória Virtual:** Técnica que permite a execução de processos cujo espaço de endereçamento exceda a memória física (RAM), utilizando espaço em disco (swap / paging file).\n* **Paginação:** A memória física é dividida em blocos de tamanho fixo chamados *Frames* (quadros), e a memória lógica em blocos de mesmo tamanho chamados *Pages* (páginas).\n* **Algoritmos de Substituição de Páginas:**\n  - *FIFO:* Substitui a página que está na memória há mais tempo.\n  - *LRU (Least Recently Used):* Substitui a página que não foi utilizada pelo maior período de tempo recente.\n  - *Ótimo (OPT):* Substitui a página que não será utilizada pelo maior período no futuro (teórico).\n\n---\n\n## 2. Linux e Windows Server\n\n### 2.1 Comandos Essenciais do Linux\n* `ls -la`: Lista arquivos com detalhes e ocultos.\n* `chmod`: Altera permissões de acesso aos arquivos (notação octal: 7 = rwx, 6 = rw-, 5 = r-x, 4 = r--).\n  - Exemplo: `chmod 755 script.sh` (dono: rwx, grupo: r-x, outros: r-x).\n* `chown`: Altera dono e grupo do arquivo (`chown usuario:grupo arquivo`).\n* `ps aux` e `top`: Visualizam processos ativos e consumo de CPU/RAM.\n* `kill -9 <PID>`: Envia sinal `SIGKILL` para encerrar processo imediatamente.\n* `grep -rn \"termo\" .`: Busca recursiva por padrão de texto em arquivos.\n* `systemctl status|start|restart <servico>`: Gerencia daemons via systemd.\n\n### 2.2 Windows Server e Active Directory (AD DS)\n* **Estrutura Lógica do Active Directory:**\n  - **Objeto:** Unidade básica (usuário, grupo, computador, impressora).\n  - **OU (Organizational Unit):** Contêiner para organizar objetos e aplicar diretivas de grupo de forma granular.\n  - **Domínio (Domain):** Limite de segurança e replicação lógica centralizada.\n  - **Árvore (Tree):** Conjunto de domínios que compartilham um namespace contíguo de DNS.\n  - **Floresta (Forest):** Nível mais alto da hierarquia; conjunto de árvores que compartilham o mesmo catálogo global (Global Catalog), esquema e configuração.\n* **GPO (Group Policy Object):** Conjunto de configurações centralizadas aplicadas a computadores e usuários em domínios ou OUs.\n* **Serviços de Rede:**\n  - **DNS (Domain Name System):** Resolução de nomes em IPs. Registros: A (IPv4), AAAA (IPv6), CNAME (alias), MX (e-mail), PTR (reverso).\n  - **DHCP (Dynamic Host Configuration Protocol):** Configuração dinâmica de rede via 4 etapas (**DORA**: *Discover ➔ Offer ➔ Request ➔ Acknowledge*).\n\n---\n\n### 📝 Checklist de Revisão\n- [ ] Saber os 5 estados de um processo\n- [ ] Entender a diferença entre escalonamento preemptivo e não preemptivo\n- [ ] Dominar o cálculo de permissões octais no Linux (chmod 755, 644, 700)\n- [ ] Conhecer a hierarquia do AD (Objeto ➔ OU ➔ Domínio ➔ Árvore ➔ Floresta)\n- [ ] Lembrar as 4 fases do DHCP (DORA)\n"}, {"id": "15-programacao", "title": "💻 Programação em Python e Java", "category": "Fundamentos de TI", "fileName": "15 - Linguagens de Programação (Python e Java).md", "content": "---\ntags:\n  - python\n  - java\n  - poo\n  - programacao\n---\n# 💻 Linguagens de Programação (Python e Java)\n\n---\n\n## 1. Paradigma de Programação Orientada a Objetos (POO)\n\n* **Abstração:** Foco nas características e comportamentos essenciais do objeto no domínio do problema.\n* **Encapsulamento:** Ocultamento dos detalhes internos de implementação e proteção do estado interno dos objetos. No Java via modificadores (`private`, `protected`, `public`), no Python por convenção (`_protegido`, `__privado`).\n* **Herança:** Mecanismo que permite que uma classe filha herde atributos e métodos de uma classe mãe (promove reutilização de código).\n* **Polimorfismo:** Capacidade de objetos de diferentes classes responderem à mesma mensagem de maneiras distintas:\n  - *Sobrecarga (Overloading):* Métodos com mesmo nome, mas assinaturas/parâmetros diferentes na mesma classe (comum em Java; simulado em Python com argumentos padrão).\n  - *Sobrescrita (Overriding):* A classe filha redefine o método herdado da classe mãe com a mesma assinatura.\n\n---\n\n## 2. Python em Concursos Públicos\n\n### 2.1 Características\n* Linguagem interpretada, de **tipagem dinâmica e forte**.\n* Indentação obrigatória como delimitador de blocos.\n* Suporte nativo a múltiplos paradigmas (POO, funcional, imperativo).\n\n### 2.2 Estruturas de Dados Embutidas\n```python\n# Lista: Ordenada, mutável, permite duplicatas\nlista = [1, 2, \"texto\", 4.5]\n\n# Tupla: Ordenada, IMUTÁVEL\ntupla = (1, 2, 3)\n\n# Dicionário: Chave-Valor, chaves únicas\ndicionario = {\"nome\": \"SEMA\", \"ano\": 2026}\n\n# Conjunto (Set): Coleção NÃO ordenada de elementos ÚNICOS\nconjunto = {1, 2, 3, 3}  # Resultado: {1, 2, 3}\n```\n\n### 2.3 Recursos Frequentes em Provas\n* **List Comprehension:** `quadrados = [x**2 for x in range(5)]` ➔ `[0, 1, 4, 9, 16]`\n* **Fatiamento (Slicing):** `s = \"SEMA-MT\"` ➔ `s[0:4]` é `\"SEMA\"`, `s[::-1]` inverte a string.\n* **Funções Lambda:** Funções anônimas de linha única: `dobro = lambda x: x * 2`\n\n---\n\n## 3. Java em Concursos Públicos\n\n### 3.1 Características e Plataforma\n* Linguagem compilada para bytecode executado sobre a **JVM (Java Virtual Machine)** — princípio *\"Write Once, Run Anywhere\"*.\n* **Tipagem estática e forte**.\n* Gerenciamento automático de memória via **Garbage Collector (GC)**.\n\n### 3.2 Modificadores de A
